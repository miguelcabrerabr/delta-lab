],formula:{expression:'P&L local long gamma ≈ ½ΓS²(σ_real²−σ_impl²)Δt − custos',variables:'Γ por unidade de spot; S em R$; vols anuais em decimal; Δt anos. Aproximação após hedge e carregamento, não promessa de P&L realizado.'},example:{title:'A vantagem de variância pode ser consumida',steps:['Gamma = 0,05 por unidade; S = 100; σ_real = 30%; σ_impl = 20%; Δt = 1/252.','Contribuição aproximada = ½×0,05×10.000×(0,09−0,04)/252 ≈ R$ 0,0496 por unidade.','Se custos do hedge forem R$ 0,04 por unidade, sobra cerca de R$ 0,0096.','O resultado é local: gamma, spot, execução e variância mudam ao longo do caminho.']},desk:'Ao explicar long vol, mostre onde o gamma está concentrado e quanto custa operar o hedge. “Realizada acima da implícita” sem ponderação e custos é uma descrição incompleta.',mistakes:['Contar ganhos do hedge sem theta e prêmio.','Aplicar fórmula local com gamma inicial a todo o caminho.','Supor que hedge mais frequente sempre melhora P&L líquido.'],references:['natenberg','hull'],lab:'hedge'},[
choice('Long gamma com hedge delta tende a:',['Comprar ações após altas e vender após quedas.','Vender ações após altas e comprar após quedas.','Nunca rebalancear.'],1,'Delta aumenta com spot; o hedge vendido precisa aumentar nas altas.',['Esse é o padrão short gamma.','Correto: o ganho de rebalanceamento financia o custo da convexidade.','O delta muda ao longo do caminho.']),
num('Γ = 0,04, S = 100, diferença de variâncias anuais = 0,05 e Δt = 1/250. Qual a contribuição local antes de custos?',0.04,'½×0,04×100²×0,05/250 = 0,04.',0.001,2),
choice('A comparação relevante para gamma scalping é:',['Somente direção final do ativo.','Variância realizada ponderada pela exposição e custos, frente ao preço da convexidade.','Número de dias em que o ativo subiu.'],1,'A trajetória e o gamma em cada região importam.',['Caminhos distintos com mesmo final geram hedges diferentes.','Correto: média simples pode esconder pesos.','Sinais dos retornos não medem magnitude nem custos.']),
num('Uma estratégia gera R$ 80 de resultado bruto de hedge/tempo e paga R$ 95 em custos totais. Qual o resultado líquido?',-15,'80 − 95 = −15.',0.01,1),
open('Por que aumentar a frequência pode reduzir dispersão do hedge e piorar a média líquida?',['Menor intervalo de exposição delta.','Mais negócios e custos.','Liquidez e slippage.'],'Intervalos menores deixam menos tempo para o delta ficar desatualizado, reduzindo parte do erro. Porém cada ajuste tem custo e pode executar em preços piores. A redução de risco pode ser comprada a um custo maior que o ganho bruto adicional; média e dispersão são objetivos diferentes.')
]);

add({id:'h3',moduleId:'hedging',title:'Gaps, liquidez e controle da mesa',minutes:45,level:'Avançado',prerequisites:['h2','g3'],objectives:['Separar neutralidade local e sobrevivência em stress.','Reconhecer risco de execução e basis hedge.','Construir limites e atribuição de P&L.'],intuition:'Um limite de delta controla uma inclinação local. Uma mesa também precisa sobreviver ao intervalo em que não consegue negociar.',theory:[
'Delta neutro significa que a primeira derivada líquida em relação a um fator é pequena naquele instante. Gamma, vega, skew, juros, dividendos, correlação, crédito e liquidez continuam presentes. Se o hedge usa um índice contra opções de uma ação, surge risco de base: a relação histórica pode falhar precisamente em notícias específicas da empresa. Mesmo a ação correta pode ficar sem liquidez ou abrir em gap.',
'Um gap salta estados intermediários nos quais o hedge contínuo teria negociado. Para uma carteira short gamma, a perda de convexidade pode ser muito maior que a previsão linear. A reprecificação deve incorporar IV e skew adversos, não só deslocar o spot. Adicione slippage de desmontagem, chamadas de margem e funding caro. Limites de notional, delta, gamma e vega são complementares; nenhum deles, isoladamente, resume a perda de cauda.',
'Uma rotina de mesa começa conciliando posições e dados, identifica eventos de calendário, mede sensibilidades e cenários, define gatilhos de hedge e verifica capacidade de execução. Depois compara P&L previsto, realizado e custos. Separar carry, movimento de mercado, mudanças de superfície e trades ajuda a detectar erro operacional e erro de modelo. Limites e escalonamento não devem depender apenas de VaR histórico, porque eventos ausentes da janela continuam possíveis.'
],formula:{expression:'P&L líquido = marcação + fluxos de hedge + carregamento − custos; risco de base = Δ_ativo ΔS_ativo + H_indice ΔS_indice',variables:'Todos os fluxos na mesma moeda e período. H_indice deve incluir multiplicador, beta/razão de hedge e sinal; a relação não é garantida.'},example:{title:'O hedge de índice não protege notícia idiossincrática',steps:['Exposição equivalente a 100 ações de preço 100; hedge de índice dimensionado para beta estimado 1.','A ação cai 12% por notícia própria; o índice cai só 2%.','Perda linear na ação ≈ R$ 1.200; ganho aproximado no hedge equivalente ≈ R$ 200.','Residual de base ≈ −R$ 1.000, antes de convexidade e custos. A estimativa histórica de beta não prometia proteção perfeita.']},desk:'Ao autorizar uma estrutura, documente também capacidade de hedge, liquidez em crise, limites por evento e quem decide reduzir risco quando o mercado salta.',mistakes:['Usar “delta neutro” como sinônimo de sem risco.','Tratar correlação histórica como contrato.','Ignorar funding e liquidez no plano de hedge.'],references:['natenberg','hull','oic-choose'],lab:'stress'},[
choice('Qual risco pode permanecer numa carteira delta-neutra?',['Gamma e vega.','Nenhum risco de mercado.','Somente erro de digitação.'],0,'Neutralidade da primeira derivada não zera as demais sensibilidades.',['Correto: além de liquidez, gaps e funding.','A afirmação ignora não linearidade e outros fatores.','Riscos econômicos continuam presentes.']),
num('Delta inicial = 0, gamma agregado = −20 e gap de spot = +5. Qual o P&L delta–gamma aproximado?',-250,'½×(−20)×5² = −250. Para gap, confirme por reprecificação.',0.01,2),
choice('Um hedge com índice contra opção de ação acrescenta principalmente:',['Garantia de correlação perfeita.','Risco de base e correlação.','Eliminação automática do gamma.'],1,'A ação pode se mover por fatores que não afetam o índice.',['A correlação é incerta e dinâmica.','Correto: é necessário stress idiossincrático.','Hedge linear não remove gamma da opção.']),
num('P&L de marcação = 500, hedge = −200, financiamento = −40 e custos = 60. Qual o P&L líquido?',200,'500 − 200 − 40 − 60 = 200.',0.01,1),
open('Monte uma resposta de mesa para gap adverso com liquidez reduzida.',['Reconciliar posição e novos cenários.','Avaliar caixa, limites e execução.','Reduzir risco conforme plano e comunicar incerteza.'],'Atualize spot, superfície e posição efetiva, incluindo possíveis exercícios. Recalcule stress e necessidade de caixa; cheque limites e contraparte. Priorize redução do risco dominante com instrumentos executáveis, mensurando slippage, e comunique faixas de resultado em vez de uma marca sem liquidez.')
]);

add({id:'e1',moduleId:'exotics',title:'Digitais, barreiras e o valor do caminho',minutes:50,level:'Avançado',prerequisites:['p3','g3'],objectives:['Distinguir digital, knock-in e knock-out.','Interpretar toque, rebate e monitoramento.','Separar simulador de payoff e modelo de preço.'],intuition:'Duas ações podem terminar no mesmo preço, mas uma barreira lembra por onde passaram. Um gráfico apenas do preço final perde essa memória.',theory:[
'Uma digital cash-or-nothing paga um valor fixo se uma condição for satisfeita. Seu payoff descontínuo perto do strike gera risco concentrado; um pequeno movimento pode mudar o pagamento inteiro. Uma barreira adiciona uma condição de trajetória à vanilla: knock-in ativa o direito após toque e knock-out o extingue. Up/down descreve barreira acima/abaixo do spot inicial; o contrato precisa definir se igualdade conta como toque, janela de observação, fonte de preço e calendário.',
'Monitoramento contínuo considera toda a trajetória; discreto observa apenas datas/horários determinados. Um caminho que cruza a barreira entre duas observações pode tocar no contrato contínuo e não no discreto. No GBM sem rebate, uma knock-in e uma knock-out com a mesma barreira, payoff e monitoramento somam a vanilla caminho a caminho. Rebates alteram essa identidade: são pagamentos por um evento, com data de pagamento que precisa ser descontada corretamente.',
'Um simulador de payoff recebe um caminho e aplica as regras; ele não determina sozinho o prêmio justo. Precificação exige distribuição de caminhos sob medida adequada, desconto, calibração e tratamento do monitoramento. Perto de uma barreira knock-out, a perda do direito pode provocar delta e gamma muito grandes ou instáveis. Hedge discreto, gaps e mudança do skew tornam a exposição particularmente difícil. Um preço BSM vanilla não é um preço de barreira, mesmo se o terminal esperado for igual.'
],formula:{expression:'KO = payoff_vanilla × 1{sem toque}; KI = payoff_vanilla × 1{toque}; KI + KO = vanilla (sem rebate)',variables:'1{evento}: indicador 0/1. Mesmos strike, prazo, barreira e monitoramento. Rebate e desconto exigem regras próprias.'},example:{title:'Mesmo final, dois direitos diferentes',steps:['Call up-and-out: K = 100, barreira B = 120, sem rebate, monitoramento nos pontos mostrados.','Caminho A: 100 → 110 → 119 → 115. Não toca 120; payoff = 15.','Caminho B: 100 → 121 → 108 → 115. Toca 120; payoff = 0.','Ambos terminam em 115. Uma call vanilla paga 15 nos dois; o caminho determina o resultado da barreira.']},desk:'Na confirmação do estruturado, destaque barreira, observações, toque por igualdade, rebate e liquidação. Ambiguidade de uma linha pode mudar toda a distribuição de resultado.',mistakes:['Usar só S_T para valorar uma barreira.','Chamar payoff de um caminho de preço justo.','Confundir monitoramento diário com contínuo.'],references:['columbia-mc','hull','b3-flex'],lab:'barrier'},[
num('Call up-and-out K100, B120, sem rebate. Caminho observado 100→122→115. Qual o payoff?',0,'O toque em 122 extinguiu o direito; o retorno a 115 não o restaura.',0.01,1),
choice('Uma knock-in sem toque até o fim, sem rebate, paga:',['O payoff vanilla automaticamente.','Zero.','O prêmio inicial corrigido.'],1,'O direito não foi ativado.',['Isso ocorreria se a condição de ativação tivesse sido satisfeita.','Correto: sem ativação, não há payoff vanilla.','Reembolso não foi previsto.']),
num('Digital paga 100 se S_T > 105. S_T = 106. Qual o payoff bruto?',100,'A condição é verdadeira; paga o valor fixo 100, não S_T−K.',0.01,1),
choice('Sem rebate e com condições iguais, knock-in + knock-out equivalem a:',['Duas vanillas.','Uma vanilla.','Caixa fixo.'],1,'Em cada caminho, exatamente uma das duas mantém o payoff vanilla.',['Não pagam ambas no mesmo caminho.','Correto: in-out parity.','O payoff ainda depende de S_T.']),
open('O laboratório identifica um toque entre pontos de observação diária. Ele deve extinguir automaticamente uma barreira diária?',['Ler a regra contratual de observação.','Distinguir caminho contínuo e amostras.','Não misturar modelo com contrato.'],'Se o contrato monitora somente fechamentos diários, um toque intradiário isolado não basta, salvo regra diferente prevista. O algoritmo precisa usar o conjunto correto de observações. Uma versão contínua e uma discreta são produtos distintos, mesmo com mesma barreira nominal.')
]);

add({id:'e2',moduleId:'exotics',title:'Asiáticas, lookbacks e risco de monitoramento',minutes:50,level:'Avançado',prerequisites:['e1'],objectives:['Calcular payoffs por média e extremos.','Distinguir média aritmética e geométrica.','Identificar viés de discretização e path dependence.'],intuition:'Média e extremo são duas memórias diferentes: a asiática suaviza observações; a lookback seleciona o melhor ou pior ponto do caminho.',theory:[
'Uma call asiática de strike fixo pode pagar max(A−K,0), onde A é a média dos fixings definidos no contrato. A média aritmética é soma dividida pelo número de observações; a geométrica é a raiz do produto. Não são intercambiáveis. Em geral, a geométrica é menor ou igual à aritmética para valores positivos. Pesos, feriados, observações já realizadas e regras de substituição de preço fazem parte do produto.',
'Uma lookback de strike flutuante pode pagar S_T−min(S_t) para uma call; uma versão de strike fixo pode pagar max(max(S_t)−K,0). Essas estruturas usam extremos e podem ser muito sensíveis à frequência de monitoramento. Aumentar o número de observações de uma lookback comprada torna o máximo não menor ou o mínimo não maior para o mesmo caminho, elevando ou mantendo o payoff. Já uma média pode subir ou descer ao adicionar observações; não há a mesma monotonicidade simples.',
'No GBM, médias geométricas têm propriedades lognormais que facilitam soluções analíticas em casos específicos. Médias aritméticas geralmente exigem aproximação ou métodos numéricos; a geométrica pode servir de controle de variância no Monte Carlo. Para opções parcialmente decorridas, os fixings passados são conhecidos e devem entrar como estado. Precificar como se toda a média ainda estivesse no futuro pode superestimar a sensibilidade. Para barreiras e extremos contínuos, uma malha discreta tende a perder eventos entre passos.'
],formula:{expression:'A_arit = (1/n)ΣS_j; A_geom = (∏S_j)^(1/n); call asiática = max(A−K,0); lookback flutuante = S_T−min_j S_j',variables:'S_j: fixings positivos em R$/ação; n: número de observações. Regras de pesos, janela e monitoramento devem ser definidas.'},example:{title:'A média muda o payoff',steps:['Fixings 80, 100, 120; strike 95; preço final 120.','Média aritmética = (80+100+120)/3 = 100. Call asiática paga 5.','Call vanilla com o mesmo strike paga 120−95 = 25.','Lookback call flutuante, observando os mesmos pontos, paga 120−80 = 40. São direitos diferentes, não preços alternativos da mesma opção.']},desk:'Pergunte se a exposição econômica do cliente é ao preço final, à média de execução ou a um extremo. O payoff deve corresponder à exposição, e o calendário de fixings deve ser auditável.',mistakes:['Trocar média aritmética por geométrica sem informar a aproximação.','Ignorar fixings já realizados.','Comparar produtos com frequências de observação diferentes como se fossem iguais.'],references:['columbia-mc','hull'],lab:'barrier'},[
num('Call asiática aritmética K100 com fixings 90, 105 e 120. Qual o payoff?',5,'Média = 315/3 = 105; payoff = 105−100 = 5.',0.01,1),
choice('Para fixings positivos, a média geométrica é:',['Sempre maior que a aritmética.','Menor ou igual à aritmética.','Sempre igual ao preço final.'],1,'A desigualdade média aritmética–geométrica vale para valores positivos.',['A relação é inversa.','Correto; igualdade quando todos os valores são iguais.','A média usa todos os fixings.']),
num('Lookback call flutuante: mínimo observado 70 e S_T = 95. Qual o payoff?',25,'95−70 = 25.',0.01,1),
choice('Adicionar pontos ao monitoramento de um máximo, no mesmo caminho, pode:',['Diminuir o máximo observado.','Manter ou aumentar o máximo observado.','Obrigatoriamente dobrá-lo.'],1,'O conjunto anterior de observações continua incluído.',['Um máximo sobre conjunto maior não pode ser menor.','Correto: pode revelar um pico antes não visto.','Não há proporcionalidade fixa.']),
open('Uma asiática está no meio do período de fixings. Que informação adicional o modelo precisa?',['Soma/média e número/pesos dos fixings passados.','Calendário e pesos restantes.','Modelo para observações futuras.'],'O estado inclui a contribuição já conhecida para a média e seu peso total. Simulam-se apenas os fixings restantes, com calendário e pesos corretos. Ignorar a parte realizada muda tanto o preço quanto delta, vega e distribuição do payoff.')
]);

add({id:'e3',moduleId:'exotics',title:'Autocallables e cupons condicionais',minutes:55,level:'Avançado',prerequisites:['e2','s3'],objectives:['Ler a ordem dos eventos de um term sheet.','Decompor nota, cupons e exposição de queda.','Explicar reinvestimento, crédito e barreiras.'],intuition:'O cupom visível é pago por direitos cedidos e riscos assumidos. Para entender um estruturado, desenhe todos os caminhos em que o cupom não chega ou o principal é afetado.',theory:[
'Um autocallable pode resgatar antecipadamente se o ativo estiver acima de um nível em datas de observação. Cupons podem depender de uma barreira própria e ter ou não memória. A proteção de principal pode ser condicional a outra barreira, observada continuamente, em datas ou apenas no final. Essas condições são independentes e precisam ser lidas na ordem definida: observar cupom, testar autocall, encerrar ou continuar. “Barreira 70%” sem dizer qual função e monitoramento é insuficiente.',
'Uma decomposição econômica combina dívida do emissor, fluxos digitais/condicionais, decisões automáticas de resgate e exposição vendida a quedas, muitas vezes semelhante a uma put condicional. Não é necessariamente uma soma estática simples de vanillas; as condições de sobrevivência ligam datas e eventos. O preço depende de taxas, dividendos, superfície, correlação para cestas, crédito do emissor e funding. Em worst-of, a pior ação domina certas condições, criando risco de correlação e concentração escondido pelo número de nomes.',
'O resgate antecipado favorece a devolução do capital em cenários de alta, limitando a participação e criando risco de reinvestimento. Em cenários ruins, o produto pode continuar vivo sem pagar cupom e terminar com perda de principal. Um “cupom de 2% ao trimestre” não equivale a retorno contratado de 8% ao ano, se pagamento e duração são condicionais. Simular fluxos em caminhos fictícios ensina o contrato; não é precificar emissão nem verificar adequação de um produto real.'
],formula:{expression:'Cupom_j = N c_j 1{condição_j e produto vivo}; principal_T depende da regra contratual; PV = E^Q[Σ desconto_j × fluxo_j]',variables:'N: notional em R$; c_j: cupom do período em decimal. Crédito, datas, memória, autocall e barreira precisam ser especificados para definir os fluxos.'},example:{title:'Um term sheet fictício e três cenários',steps:['N = 1.000; cupom de 2% por trimestre se S ≥ 80; autocall se S ≥ 100 nas observações; sem memória. No final, se não resgatado e S < 70, principal = 1.000×S/100; caso contrário, 1.000.','Na primeira data S = 105: paga cupom 20 e resgata 1.000. A operação termina; não há mais cupons.','Caminho 90,85,82,75: paga 20 em cada uma das três primeiras datas, zero na última; devolve principal 1.000.','Caminho 75,72,68,60: nenhum cupom; principal final 600. Perda de 400, antes de custos e risco de crédito.']},desk:'Traduza o term sheet para árvore de decisões e tabela de fluxos. Peça ao cliente que explique o pior cenário com suas próprias palavras antes de discutir o cupom anunciado.',mistakes:['Somar cupons futuros que deixam de existir após autocall.','Confundir barreira de cupom com barreira de principal.','Chamar proteção condicional de garantia incondicional.'],references:['hull','b3-flex'],lab:'barrier'},[
num('Notional 2.000; cupom condicional de 1,5% no período; condição satisfeita e produto vivo. Qual o cupom?',30,'2.000×0,015 = 30.',0.01,1),
choice('Após um autocall que encerra o produto:',['Todos os cupons futuros continuam devidos.','Aplicam-se os fluxos de resgate e cessam os futuros não previstos.','O principal é necessariamente perdido.'],1,'O contrato define o pagamento de resgate e encerra a exposição.',['Não se pode somar cupons de períodos que não ocorrerão.','Correto: conferir term sheet e eventual cupom na data.','Autocall costuma envolver devolução prevista do principal.']),
num('Pela regra fictícia principal = N×S_T/S0 quando S_T < 70% de S0: N = 1.000, S0 = 100, S_T = 55. Qual principal?',550,'1.000×55/100 = 550.',0.01,2),
choice('Qual risco aparece quando o produto resgata cedo em cenário favorável?',['Risco de reinvestir o capital em condições piores.','Garantia de receber todos os cupons anuais.','Eliminação retroativa do risco de crédito.'],0,'O horizonte efetivo depende do caminho e as novas oportunidades podem pagar menos.',['Correto: duração e retorno são condicionais.','Cupons futuros podem desaparecer.','O risco de crédito existiu enquanto havia obrigação do emissor.']),
open('Explique por que uma nota worst-of com quatro ações não é automaticamente diversificada.',['Pior ativo pode determinar perda.','Correlação e caudas conjuntas.','Condições de cupom/barreira e crédito.'],'A regra pode selecionar justamente o pior desempenho, e não a média da cesta. Mais nomes podem aumentar as oportunidades de um evento adverso, dependendo do contrato e da correlação. É preciso simular movimentos assimétricos, correlações em crise, barreiras e risco do emissor.')
]);

add({id:'c1',moduleId:'professional',title:'Caso de cliente: proteger sem perder a tese',minutes:55,level:'Aplicação',prerequisites:['s3','g3'],objectives:['Traduzir necessidade em restrições de payoff.','Comparar alternativas com a mesma base econômica.','Comunicar custo, cenário e limitação.'],intuition:'A estrutura começa pelo problema do cliente, não pelo nome de uma estratégia ou pela opção com maior prêmio.',theory:[
'Caso fictício: uma gestora possui 10.000 ações de uma empresa fictícia a R$ 100, horizonte de três meses, e quer limitar a perda terminal a cerca de 10% do valor atual. Ela aceita ceder parte da alta, mas pode precisar vender antes. Antes de propor opções, confirme se o piso desejado inclui prêmio, custos e tributos, se a quantidade da posição ficará estável e se há liquidez nas séries adequadas. Um piso terminal não equivale a um preço garantido de saída antecipada.',
'Compare protective put, collar e redução da posição em ações. Uma put K90 custa 3: valor terminal mínimo da combinação é 90, mas o desembolso total é 103; a perda em relação ao custo atual da estratégia é 13. Um collar com a mesma put e call K110 vendida por 3 tem custo líquido de opções zero e intervalo terminal de P&L entre −10 e +10 por ação, antes de custos. Reduzir a ação baixa delta e notional, mas não oferece o mesmo formato convexo.',
'O exercício profissional exige distinguir orçamento de prêmio, perda econômica e custo de oportunidade. Se o cliente exige perda máxima de 10 incluindo prêmio, a put K90 por 3 não atende sozinha. Ajustar strike, tamanho ou financiamento pode alterar o resultado. Mostre cenários de queda, estabilidade, alta forte e desmontagem antecipada; inclua bid/ask, exercício, dividendos e financiamento. Uma recomendação no contexto do exercício deve defender o ajuste às restrições, não prometer a melhor rentabilidade.'
],formula:{expression:'P&L protective put = S_T − S0 + max(Kp−S_T,0) − p; perda máxima = S0 + p − Kp',variables:'Valores por ação, sem custos. Multiplicar pela quantidade econômica coberta; o strike do piso não é o mesmo que a perda líquida máxima.'},example:{title:'Cobertura de R$ 1 milhão',steps:['10.000 ações a 100; put K90 por 3; call K110 vendida por 3, mesmo prazo.','Collar: em S_T = 70, P&L = (90−100)×10.000 = −100.000.','Em S_T = 105, P&L = 5×10.000 = +50.000. Em S_T = 130, P&L = 10×10.000 = +100.000.','A protective put isolada custa 30.000 e preserva alta; em S_T = 130, P&L = (130−100−3)×10.000 = +270.000.']},desk:'Apresente duas alternativas comparáveis e uma opção de não operar/reduzir posição. Registre qual restrição motivou a escolha e quais cenários fariam o cliente preferir a alternativa.',mistakes:['Dizer “protege em 90” sem incluir o prêmio no resultado.','Cobrir quantidade diferente da posição real sem explicar o risco residual.','Omitir o custo de oportunidade de uma alta acima da call vendida.'],references:['oic-choose','oic-strategies','natenberg'],lab:'strategy'},[
num('Ação a 100 + put K90 por 3. Qual a perda máxima nominal por ação, incluindo prêmio?',13,'Custo inicial 103; piso terminal 90; perda máxima 13.',0.01,2),
choice('Qual informação é essencial antes de propor proteção?',['Apenas a maior taxa de cupom disponível.','Horizonte, perda tolerada, orçamento e necessidade de liquidez.','Somente o último preço do ativo.'],1,'A estrutura deve corresponder ao problema econômico do cliente.',['Cupom não define adequação.','Correto: restrições e cenários orientam a escolha.','Spot isolado não revela necessidade nem risco.']),
num('Collar com custo líquido zero trava P&L mínimo em −10 por ação. Há 10.000 ações cobertas. Qual a perda máxima nominal total?',100000,'10 × 10.000 = R$ 100.000. Resposta em magnitude positiva.',0.01,1),
choice('Um collar terminalmente protegido garante a mesma perda máxima se desmontado antes?',['Sim, em qualquer mercado e custo.','Não necessariamente: marcação, bid/ask e condições de saída importam.','Só se o cliente não olhar a tela.'],1,'O limite de payoff não é uma cotação executável antecipada garantida.',['Isso ignora custos e mark-to-market.','Correto: o horizonte da promessa precisa ser explícito.','A observação do cliente não altera os fluxos.']),
open('Defenda uma escolha entre put, collar e redução de ações para o caso da aula.',['Relacionar escolha a restrições.','Comparar perda, prêmio e alta cedida.','Incluir liquidez e prazo.'],'Se o orçamento de prêmio é zero e o cliente aceita teto em 110, o collar se ajusta ao piso terminal de −10 por ação. Se preservar alta é essencial e há orçamento, a put é preferível, mas o strike deve considerar o prêmio na perda total. Se há grande chance de saída antecipada, reduzir posição pode oferecer simplicidade e liquidez, com payoff diferente.')
]);

add({id:'c2',moduleId:'professional',title:'Caso de mesa: resultado corporativo e risco escondido',minutes:55,level:'Aplicação',prerequisites:['v3','h3'],objectives:['Confrontar tese de evento com preço implícito.','Comparar estruturas com risco delimitado.','Construir uma defesa com cenários adversos.'],intuition:'Acertar o anúncio não basta: é preciso acertar quanto do anúncio já estava no preço e como a superfície reagirá depois.',theory:[
'Caso fictício: ação a 100, anúncio amanhã, straddle curto de prazo custa 10. Um cliente espera movimento de 6 a 8, sem convicção direcional, e sugere comprar o straddle porque “haverá volatilidade”. No vencimento, os breakevens são 90 e 110. Se o movimento terminal for 8, a perda será 2, mesmo com a previsão de volatilidade correta em linguagem comum. Antes do vencimento, IV pós-evento e tempo residual modificam o resultado.',
'Uma visão de alta moderada pode ser expressa por call, bull call spread ou ação com stop operacional. A call preserva alta além do strike, mas paga mais convexidade e vega; a vertical reduz prêmio e limita ganho; um stop não garante preço em gap. Vender iron condor para capturar vol crush assume que o movimento e a reprecificação não superarão o prêmio e as asas. O retorno aparente deve ser comparado à perda de stress, não apenas ao prêmio recebido.',
'Construa cenários combinados: spot +8 com IV −15 pp; spot −15 com IV +10 pp; spot estável com forte vol crush; gap atravessando asas. Reprecifique as pernas e descreva exercício, margem e liquidez. Se um input não é observável, mostre intervalo. Uma tese pode estar certa e o trade errado por strike, prazo, preço de entrada, tamanho ou execução. A conclusão profissional inclui condições em que a tese deixa de valer e como o risco será reduzido.'
],formula:{expression:'Straddle terminal: P&L = |S_T−K|−D; aproximação evento = ΔΔS + ½Γ(ΔS)² + VegaΔσ + ΘΔt',variables:'D: prêmio total; K: strike comum. Para choques grandes, use reprecificação completa e regra de superfície explícita.'},example:{title:'Direção correta, posição errada',steps:['Call comprada a 8, strike 100. Após anúncio e no vencimento, S_T = 106.','A previsão de alta se confirmou; payoff = 6 e P&L = −2.','Bull call 100/110 comprada a 4, no mesmo terminal, paga 6 e gera +2.','Se S_T = 130, call gera 22 e vertical gera 6. A segunda atende alta moderada, mas cede a alta extrema.']},desk:'Ao discutir eventos, peça uma distribuição de cenários, não apenas um preço-alvo. Compare essa distribuição ao custo e às exposições da estrutura.',mistakes:['Equiparar notícia importante a lucro de straddle comprado.','Tratar stop como perda máxima contratual em gap.','Comparar estratégias sem normalizar prêmio, delta ou orçamento de perda.'],references:['oic-choose','cboe-decomposition','natenberg'],lab:'stress'},[
num('Straddle K100 custa 10. No vencimento S_T = 108. Qual o P&L por unidade?',-2,'|108−100|−10 = −2.',0.01,1),
choice('Um stop em ação garante perda máxima durante gap?',['Sim, sempre executa exatamente no gatilho.','Não: o preço executável pode saltar o gatilho.','Sim, se o gráfico for diário.'],1,'Gatilho e preço de execução são conceitos diferentes.',['Em gap pode não haver negociação no preço do gatilho.','Correto: liquidez e tipo de ordem importam.','A frequência do gráfico não cria liquidez.']),
num('Call K100 custa 8; bull call 100/110 custa 4. Em S_T = 106, quanto a vertical supera a call em P&L por unidade?',4,'Vertical ganha 2; call perde 2; diferença = 4.',0.01,2),
choice('Qual cenário é mais informativo para stress pós-evento?',['Mudar só spot e congelar todos os demais fatores sem explicar.','Combinar spot, IV, prazo e custos coerentes com o evento.','Usar apenas o cenário de lucro máximo.'],1,'Eventos afetam vários fatores simultaneamente.',['Pode ser um cenário isolado útil, mas não basta para o evento.','Correto: explicite também a dinâmica da superfície.','Não revela risco.']),
open('Prepare uma resposta curta ao cliente que quer comprar straddle porque “vai ter notícia”.',['Comparar movimento esperado ao prêmio.','Explicar IV e vol crush.','Apresentar alternativas e cenário de perda.'],'A notícia pode gerar movimento, mas o straddle já custa 10 e exige mais de 10 no terminal para lucrar. Um movimento de 8 ainda perde 2; a IV também pode cair após a divulgação. Se sua tese é alta moderada, podemos comparar uma vertical com perda limitada, deixando claro o teto de ganho e o prazo.')
]);

add({id:'c3',moduleId:'professional',title:'Caso integrador: do term sheet à decisão defendida',minutes:65,level:'Aplicação',prerequisites:['c1','c2','e3'],objectives:['Auditar premissas e comparar alternativas.','Escrever uma recomendação defensável no exercício.','Separar cálculo, julgamento e incerteza.'],intuition:'Uma boa recomendação permite que outra pessoa reconstrua a conta, entenda o risco e discorde das premissas sem precisar adivinhar o que foi omitido.',theory:[
'Caso final fictício: um cliente tem R$ 500 mil, horizonte de um ano, afirma que pode aceitar perda de até 10%, mas pede cupom elevado e liquidez diária. Uma proposta inclui nota autocallable com cupom condicional, barreira de principal observada só no final e mercado secundário a preço do emissor. A primeira tarefa é identificar incompatibilidades: cupom condicional não é renda garantida; barreira não é necessariamente piso de 90%; liquidez diária não significa valor de resgate estável.',
'Decomponha os fluxos e compare com uma carteira simples de caixa mais exposição limitada em opções ou com ação protegida, conforme as hipóteses do exercício. Use a mesma moeda, horizonte, capital inicial e regra de custos. Calcule cenários de alta, lateralidade, queda moderada, queda extrema, resgate precoce e necessidade de vender antes. Para nota, acrescente risco de crédito e reinvestimento; para opções, mostre prêmio, margem, estilo e necessidade de gestão. Não reduza a comparação a um único retorno esperado.',
'A recomendação deve conter objetivo, restrições confirmadas, alternativa escolhida, razão, riscos aceitos e condições de revisão. Distinga fatos contratuais de hipóteses de modelo e opiniões sobre mercado. Um cálculo de payoff pode ser exato dado um caminho, enquanto o preço de emissão permanece incerto. Questões abertas nesta plataforma usam rubrica e resposta comentada: não há modelo conectado julgando a qualidade da argumentação. A demonstração de domínio exige contas corretas e capacidade de explicar cenários adversos.'
],formula:{expression:'Perda percentual = (capital inicial − valor final líquido)/capital inicial × 100; retorno comparável exige mesmos fluxos e datas',variables:'Capital e valor final em R$, com custos e reinvestimento explicitados. Retornos condicionais não podem ser somados como se todos fossem certos.'},example:{title:'O cupom não corrige o principal',steps:['Nota fictícia de 500.000 paga um único cupom de 10.000 e termina devolvendo principal de 350.000.','Recebimento total nominal = 360.000. Perda = 140.000.','Perda percentual = 140.000/500.000 = 28%, antes de considerar o tempo dos fluxos.','O limite declarado de 10% foi excedido: o produto é incompatível com essa restrição no cenário, mesmo tendo pago cupom.']},desk:'Um resumo de uma página deve permitir ao cliente identificar quanto pode perder, quando pode precisar de caixa, o que limita o ganho e o que depende de hipótese. Preserve a versão do term sheet analisado.',mistakes:['Omitir incompatibilidade entre perda tolerada e perda contratual possível.','Confundir liquidez disponível com saída sem perda.','Apresentar resposta aberta como corrigida automaticamente por inteligência inexistente.'],references:['oic-choose','hull','natenberg'],lab:'strategy'},[
num('Capital inicial 500.000; principal final 350.000 e cupons recebidos 10.000. Qual a perda percentual nominal?',28,'(500.000−360.000)/500.000 × 100 = 28%.',0.01,2),
choice('“Mercado secundário diário” significa necessariamente:',['Resgate pelo valor investido a qualquer momento.','Possibilidade de cotação/negociação, sujeita a preço e condições.','Ausência de risco de crédito.'],1,'Liquidez e estabilidade de valor são propriedades diferentes.',['O preço pode ser muito inferior ao principal.','Correto: condições e bid/ask precisam ser verificados.','A obrigação do emissor continua relevante.']),
choice('Uma recomendação defensável deve separar:',['Somente os cenários bons.','Fatos contratuais, hipóteses de modelo e visão de mercado.','Apenas as maiores taxas anunciadas.'],1,'Cada tipo de afirmação tem evidência e incerteza diferentes.',['Isso impede entender a distribuição de perdas.','Correto: facilita revisão e decisão informada.','Taxa isolada não representa o produto.']),
num('Uma carteira de R$ 500.000 tem limite de perda de 10%. Qual a perda máxima em reais permitida pela restrição?',50000,'500.000 × 0,10 = 50.000.',0.01,1),
open('Escreva uma recomendação para o caso final, identificando uma incompatibilidade e uma alternativa a investigar.',['Citar perda máxima e liquidez como restrições.','Explicar que cupom e principal são condicionais.','Comparar alternativa na mesma base e não inventar cotação.','Declarar premissas e necessidade de verificar contrato/custos.'],'A nota não atende ao limite de 10% se sua regra permite perda proporcional grande do principal; o cupom condicional não corrige isso. A liquidez secundária também não garante saída a 90% do capital. Eu investigaria uma carteira com reserva em caixa e orçamento estritamente limitado para opções, ou proteção contratual compatível, comparando custos, crédito e cenários no mesmo horizonte. Sem preços executáveis e contrato completo, a escolha permanece uma hipótese do exercício.')
]);

 {id:'hull',title:'John C. Hull · Options, Futures, and Other Derivatives',url:'https://www-2.rotman.utoronto.ca/~hull/',note:'Referência temática: fundamentos, não arbitragem, árvores, BSM, gregas, volatilidade e exóticas. Não havia PDF no projeto; edição, capítulos e páginas não foram verificados. Não se afirma consulta integral.'},

const glossary = [

 ['European option','Opção exercível somente na data prevista de vencimento.'],
 ['Call','Direito de comprar o ativo pelo strike, nas condições do contrato.'],
 ['Put','Direito de vender o ativo pelo strike, nas condições do contrato.'],

 ['Prêmio','Preço pago pelo direito da opção; recebido pelo lançador que assume a obrigação.'],
 ['Payoff','Fluxo econômico de liquidação do derivativo, antes de prêmio, custos e financiamento.'],
 ['P&L','Profit and loss: resultado que reconcilia marcação e todos os fluxos relevantes.'],
 ['Moneyness','Relação entre spot ou forward e strike; declarar qual referência foi usada.'],
 ['ITM','In the money: call com S>K ou put com S<K, pela convenção spot.'],
 ['ATM','At the money: próximo ao strike; pode ser definido em spot, forward ou delta.'],
 ['OTM','Out of the money: call com S<K ou put com S>K, pela convenção spot.'],
 ['Valor intrínseco','Valor do exercício imediato: max(S−K,0) para call e max(K−S,0) para put.'],
 ['Valor temporal','Prêmio menos intrínseco; pode exigir cuidado em europeias com carregamento.'],
 ['Forward','Contrato com obrigações de troca futura a preço de entrega combinado.'],
 ['Futuro','Derivativo padronizado com ajustes periódicos de caixa segundo regras da bolsa.'],
 ['Swap','Contrato de troca de fluxos definidos por indexadores e um notional.'],
 ['Notional','Base econômica usada para calcular fluxos; não é necessariamente desembolso ou perda máxima.'],
 ['Multiplicador','Fator que converte quantidade de contratos em unidades econômicas. Confirmar a série.'],
 ['Margem','Garantia exigida para cobrir risco de inadimplência; não limita a perda contratual.'],
 ['Assignment','Atribuição de uma obrigação de exercício ao lançador.'],
 ['Carregamento','Efeito líquido de financiamento, renda do ativo e demais custos de manter exposição.'],
 ['Paridade put–call','Relação de não arbitragem entre call, put, ativo pré-pago e valor presente do strike.'],
 ['Replicação','Carteira que reproduz os fluxos de outro instrumento nos estados do modelo.'],
 ['Medida neutra ao risco','Medida de precificação na qual preços descontados apropriados são martingais; não é previsão física.'],
 ['Delta','Sensibilidade local do valor ao spot; pode ser expresso em ações equivalentes após agregação.'],
 ['Gamma','Sensibilidade do delta ao spot e curvatura do preço em relação ao ativo.'],
 ['Vega','Sensibilidade à volatilidade; declarar se por unidade decimal ou por ponto percentual.'],
 ['Theta','Sensibilidade ao tempo que passa, mantendo outros inputs fixos; declarar base diária/anual.'],
 ['Rho','Sensibilidade à taxa de juros; declarar decimal, ponto percentual ou basis point.'],
 ['Vanna','Derivada cruzada entre spot e volatilidade; mudança de delta com IV.'],
 ['Volga / Vomma','Curvatura do preço em volatilidade, isto é, derivada do vega.'],
 ['Charm','Mudança de delta com o tempo; sinal depende de tempo decorrido versus prazo restante.'],
 ['Volatilidade implícita','Parâmetro do modelo que reproduz um preço observado de opção.'],
 ['Volatilidade realizada','Medida ex post da variabilidade de retornos em uma janela e frequência definidas.'],
 ['Smile','Variação da IV por strike para um vencimento.'],
 ['Skew','Inclinação/assimetria da superfície de volatilidade em strike ou moneyness.'],
 ['Term structure','Estrutura a termo: relação entre volatilidade ou outro parâmetro e vencimento.'],
 ['Variância total','σ²T: escala de dispersão acumulada de um horizonte sob hipóteses compatíveis.'],
 ['Vol crush','Queda da IV após resolução de uma fonte de incerteza, como resultados.'],
 ['Sticky strike','Cenário em que IV por strike permanece fixa quando spot muda.'],
 ['Sticky delta','Cenário em que a forma da superfície permanece em coordenadas de delta, deslocando strikes.'],
 ['Gamma scalping','Rebalanceamento delta de exposição convexa, cujo resultado deve incluir theta, funding e custos.'],
 ['Slippage','Diferença entre preço de referência/esperado e preço efetivamente executado.'],
 ['Gap','Salto entre preços negociáveis, durante o qual um hedge contínuo não pode ser executado.'],
 ['Basis risk','Risco de a exposição e o instrumento de hedge se moverem de forma diferente.'],
 ['Digital','Opção com pagamento fixo ou binário condicionado a um evento.'],
 ['Knock-in','Barreira cujo toque ativa um direito.'],
 ['Knock-out','Barreira cujo toque extingue um direito.'],
 ['Rebate','Pagamento contratual associado a um evento de barreira, com data e regra específicas.'],
 ['Asiática','Opção cujo payoff depende de uma média de preços definida no contrato.'],
 ['Lookback','Opção cujo payoff depende de um máximo ou mínimo observado no caminho.'],

 'Calendar':()=>[mk('call',-1,100,4,30),mk('call',1,100,7,90)],'Diagonal':()=>[mk('call',-1,105,3,30),mk('call',1,100,7,90)],'Ratio call 1×2':()=>[mk('call',1,100,6),mk('call',-2,110,2)],'Call backspread 1×2':()=>[mk('call',-1,95,10),mk('call',2,105,4)],
 'Box spread':()=>[mk('call',1,90,14),mk('call',-1,110,2),mk('put',1,110,11),mk('put',-1,90,1)],'Conversão':()=>[mk('stock',1,0,100),mk('put',1,100,4),mk('call',-1,100,6)],'Reversão':()=>[mk('stock',-1,0,100),mk('put',-1,100,4),mk('call',1,100,6)]
};legs=templates['Bull call spread']();
function market(){return {S:+inputs.S,K:+inputs.K,T:+inputs.days/365,r:+inputs.r/100,q:+inputs.q/100,sigma:+inputs.vol/100,type:inputs.type};}
function baseFields({option=true,steps=false}={}){return field('S','Spot (R$)',inputs.S,{min:0})+(option?field('K','Strike (R$)',inputs.K,{min:.0001}):'')+field('days','Prazo (dias corridos)',inputs.days,{min:0,max:10950})+field('r','Taxa contínua (% a.a.)',inputs.r,{min:-200,max:200})+field('q','Dividend yield (% a.a.)',inputs.q,{min:-200,max:200})+field('vol','Volatilidade (% a.a.)',inputs.vol,{min:0,max:500})+(option?field('type','Opção',inputs.type,{options:[['call','Call'],['put','Put']]}):'')+(steps?field('steps','Passos da árvore',inputs.steps,{min:1,max:1500,step:1}):'');}
function view(id){active=list.some(x=>x.id===id)?id:'strategy';return `<div class="page-heading"><div><p class="eyebrow">EXPERIMENTAR PARA ENTENDER</p><h1>Laboratórios de mesa</h1><p class="lead muted">Altere uma hipótese. Observe o preço. Entenda o risco.</p></div><span class="tag">DADOS FICTÍCIOS · OFFLINE</span></div><div class="tabs" aria-label="Laboratórios">${list.map(x=>`<button data-lab="${x.id}" class="${x.id===active?'active':''}">${x.icon} ${esc(x.title)}</button>`).join('')}</div><div id="lab-body"></div>`;}
function mount(){document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>location.hash='lab/'+b.dataset.lab);render();}
function render(){const body=document.getElementById('lab-body');let extra='',fields=baseFields({option:!['strategy','stress'].includes(active),steps:active==='calculator'});
 if(active==='strategy'){fields=field('S','Spot atual (R$)',inputs.S,{min:.001})+field('r','Taxa contínua (% a.a.)',inputs.r)+field('q','Dividend yield (% a.a.)',inputs.q)+field('vol','Volatilidade (% a.a.)',inputs.vol,{min:0,max:500});extra=field('horizon','Horizonte (dias corridos)',0,{min:0,hint:'Máximo: primeiro vencimento. MTM europeu.'})+field('display','Curva exibida','pnl',{options:[['pnl','P&L — inclui prêmio inicial'],['value','Valor bruto — antes do prêmio']]});}
 if(active==='greeks')extra=field('greek','Grega exibida','delta',{options:[['delta','Delta — por R$ de spot'],['gamma','Gamma — por R$²'],['thetaDay','Theta — R$ por dia'],['vega','Vega — R$ por 1 p.p.'],['rho','Rho — R$ por 1 p.p.'],['vanna','Vanna — vol em decimal'],['volga','Volga — vol em decimal²'],['charm','Charm — delta por ano']]});
 if(active==='stress'){fields=field('S','Spot base (R$)',inputs.S,{min:.001})+field('r','Taxa contínua (% a.a.)',inputs.r)+field('q','Dividend yield (% a.a.)',inputs.q)+field('vol','Volatilidade base (% a.a.)',inputs.vol,{min:10,max:490});extra=field('elapsed','Passagem de tempo (dias)',5,{min:0})+field('method','Exibição','full',{options:[['full','Reprecificação completa'],['approx','Aproximação por gregas'],['error','Diferença: completa − gregas']]});}
 if(active==='calculator')extra=field('target','Prêmio para IV (R$)',6,{min:0})+field('paths','Caminhos Monte Carlo',15000,{min:100,max:100000,step:100})+field('seed','Semente',42,{step:1});
 if(active==='hedge')extra=field('realized','Vol do caminho (% a.a.)',30,{min:0,max:300})+field('drift','Drift do ativo (% a.a.)',5)+field('pathSteps','Passos do caminho',90,{min:2,max:1000,step:1})+field('every','Rebalancear a cada N passos',5,{min:1,step:1})+field('costBps','Custo por operação (bps)',5,{min:0,max:1000})+field('seed','Semente',42,{step:1});
 if(active==='barrier'){fields=field('S','Spot inicial (R$)',100,{min:.01})+field('K','Strike (R$)',100,{min:.01})+field('terminal','Spot final comum (R$)',110,{min:.01})+field('barrier','Barreira (R$)',125,{min:.01})+field('direction','Direção','up',{options:[['up','Up — barreira superior'],['down','Down — barreira inferior']]})+field('knock','Contrato','out',{options:[['out','Knock-out'],['in','Knock-in']]})+field('type','Opção','call',{options:[['call','Call'],['put','Put']]});extra=field('rebate','Rebate no vencimento (R$)',0,{min:0})+field('bump','Desvio do caminho B',.3,{min:-1,max:1,step:.05})+field('seed','Semente',42,{step:1});}
 body.innerHTML=`<div class="lab-layout"><aside class="card controls"><h3>Premissas do experimento</h3><form id="lab-form">${fields}${extra}<button class="primary" type="submit">Recalcular cenários ↗</button></form><p class="caption" style="margin-top:16px">Preços por unidade. Taxas contínuas; T = dias corridos / 365. Dividendos como yield constante.</p></aside><div><div id="lab-error" role="alert"></div>${active==='strategy'?strategyEditor():''}<div id="lab-output" aria-live="polite"></div></div></div>`;
 document.getElementById('lab-form').onsubmit=e=>{e.preventDefault();calculate();};if(active==='strategy')bindEditor();calculate();}
function strategyEditor(){return `<section class="card" style="margin-bottom:20px"><div class="section-head" style="margin-top:0"><h2>Suas posições</h2><button id="add-leg" class="small">+ Adicionar perna</button></div><label class="field"><span>Começar com uma estrutura</span><select id="template">${Object.keys(templates).map(t=>`<option ${t===templateName?'selected':''}>${esc(t)}</option>`).join('')}</select></label><div class="table-scroll"><table><caption class="sr-only">Editor de pernas da estratégia</caption><thead><tr><th>Ativo</th><th>Qtd. ±</th><th>Strike</th><th>Prêmio / custo</th><th>Dias</th><th>Multiplicador</th><th></th></tr></thead><tbody id="legs"></tbody></table></div><p class="caption" style="margin-top:12px">Quantidade positiva = compra; negativa = venda. Multiplicador explícito por perna; não pressupõe lote B3 de 100. Prêmios dos templates são ilustrativos.</p></section>`;}
function renderLegs(){document.getElementById('legs').innerHTML=legs.map((l,i)=>`<tr><td><select data-leg="${i}" data-prop="type" aria-label="Ativo da perna ${i+1}">${[['stock','Ação'],['call','Call'],['put','Put']].map(([v,t])=>`<option value="${v}" ${l.type===v?'selected':''}>${t}</option>`).join('')}</select></td>${[['qty',l.qty],['K',l.K],['premium',l.premium],['T',Math.round(l.T*365)],['mult',l.mult]].map(([k,v])=>`<td><input type="number" step="any" data-leg="${i}" data-prop="${k}" aria-label="${{qty:'Quantidade',K:'Strike',premium:'Prêmio',T:'Dias',mult:'Multiplicador'}[k]} da perna ${i+1}" value="${v}"></td>`).join('')}<td><button class="small danger" data-remove="${i}" aria-label="Remover perna ${i+1}">×</button></td></tr>`).join('');
 document.querySelectorAll('[data-leg]').forEach(el=>el.onchange=()=>{const v=el.dataset.prop==='type'?el.value:el.value.trim()===''?NaN:Number(el.value)/(el.dataset.prop==='T'?365:1);legs[+el.dataset.leg][el.dataset.prop]=v;calculate();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{legs.splice(+b.dataset.remove,1);renderLegs();calculate();});}
function bindEditor(){renderLegs();document.getElementById('add-leg').onclick=()=>{if(legs.length>=12)return U.toast('Limite didático: 12 pernas.');legs.push(mk('call',1));renderLegs();calculate();};document.getElementById('template').onchange=e=>{templateName=e.target.value;legs=templates[templateName]();document.querySelector('[name="horizon"]').value=0;renderLegs();calculate();};}
function data(){const d=Object.fromEntries(new FormData(document.getElementById('lab-form')));for(const k in d)if(!['type','greek','method','direction','knock','display'].includes(k)){if(String(d[k]).trim()==='')throw Error('Preencha todos os campos numéricos.');d[k]=Number(d[k]);if(!Number.isFinite(d[k]))throw Error('Informe números finitos.');}for(const k of Object.keys(inputs))if(k in d)inputs[k]=d[k];return d;}
function calculate(){const err=document.getElementById('lab-error'),out=document.getElementById('lab-output');err.innerHTML='';try{const d=data(),p=market();out.innerHTML=({strategy:strategyOutput,calculator:calculatorOutput,greeks:greeksOutput,stress:stressOutput,hedge:hedgeOutput,barrier:barrierOutput})[active](p,d);document.getElementById('export-hedge')?.addEventListener('click',()=>{const keys=Object.keys(lastHedge.rows[0]);U.download('delta-lab-fluxos-hedge.csv',[keys.join(';'),...lastHedge.rows.map(r=>keys.map(k=>r[k]).join(';'))].join('\n'),'text/csv;charset=utf-8');});}catch(e){err.innerHTML=`<div class="error">${esc(e.message)}</div>`;out.innerHTML='';}}
function strategyOutput(p,d){if(!legs.length)throw Error('Adicione ao menos uma perna.');const options=legs.filter(l=>l.type!=='stock'),expiry=options.length?Math.min(...options.map(l=>l.T)):0,h=d.horizon/365;if(h>expiry&&options.length)throw Error(`Horizonte máximo: ${num(expiry*365,0)} dias (primeiro vencimento).`);
 const cost=legs.reduce((sum,l)=>sum+l.qty*l.mult*l.premium,0),offset=d.display==='value'?cost:0;const xs=range(0,Math.max(p.S*2,...legs.map(l=>l.K*1.5)),101),limit=F.strategyLimits(legs),series=[{name:`${d.display==='value'?'Valor bruto':'P&L MTM'} em ${d.horizon} dias`,points:xs.map(s=>[s,F.strategy(legs,s,p,h)+offset])},{name:limit.mixed?'Primeiro vencimento + valor residual':d.display==='value'?'Payoff bruto no vencimento':'P&L no vencimento',dash:true,points:xs.map(s=>[s,F.strategy(legs,s,p,expiry)+offset])}];const current=F.strategy(legs,p.S,p,0),g=F.portfolioGreeks(legs,p);
 return `<section class="card"><p class="eyebrow">ESTRATÉGIA · ${legs.length} PERNAS</p><h2>Um mapa do seu resultado</h2><div class="metric-row">${metric('MTM atual menos custo',money(current))}${metric('Delta da carteira',num(g.delta,3))}${metric('Vega / 1 p.p.',money(g.vega))}</div>${chart(series,{yLabel:d.display==='value'?'Valor bruto (R$)':'P&L (R$)'})}${chartTable(series)}<p class="caption">Custo líquido inicial: ${money(cost)}. Limites abaixo sempre em P&L, incluindo prêmio inicial.</p><div class="grid three"><div><span class="caption">Máximo ganho terminal</span><h3>${limit.mixed?'Depende do caminho':money(limit.max)}</h3></div><div><span class="caption">Pior P&L terminal</span><h3>${limit.mixed?'Depende do caminho':money(limit.min)}</h3></div><div><span class="caption">Breakevens terminais</span><h3>${limit.mixed?'Não há um único payoff':limit.breakevens.length?limit.breakevens.map(x=>num(x)).join(' · '):'Nenhum'}</h3>${!limit.mixed&&limit.zeroIntervals.length?`<p class="caption">Faixas com P&L zero: ${limit.zeroIntervals.map(x=>x.map(n=>num(n)).join(' a ')).join('; ')}</p>`:''}</div></div><div class="callout">${limit.mixed?'Vencimentos diferentes: a curva pontilhada liquida apenas a primeira expiração e marca as demais a BSM. Não é o payoff final da carteira. Volatilidade, juros e dividend yield são mantidos constantes.':'Limites e breakevens são calculados por trechos lineares para spot ≥ 0, além da janela do gráfico. O payoff exclui financiamento, dividendos recebidos, custos e exercício antecipado.'}</div><p class="caption">MTM usa opções europeias. Na exibição P&L, subtraímos o desembolso inicial; valor bruto exclui esse custo. Nenhuma curva representa retorno percentual. Posição comprada paga o prêmio; vendida o recebe.</p></section>`;}
function calculatorOutput(p,d){const b=F.bsm(p),lim=F.bounds(p);let european,american,treeError='';try{european=F.binomial(p,d.steps,false);american=F.binomial(p,d.steps,true);}catch(e){treeError=e.message;}let iv,ivError='';try{iv=F.implied(p,d.target);}catch(e){ivError=e.message;}const mc=F.monteCarlo(p,d.paths,d.seed),rows=[['Delta',b.delta,'unidades do ativo / opção'],['Gamma',b.gamma,'delta / R$ de spot'],['Theta',b.thetaDay,'R$ / dia corrido'],['Vega',b.vega,'R$ / 1 p.p. de vol'],['Rho',b.rho,'R$ / 1 p.p. de taxa'],['Vanna',b.vanna,'delta / 1,00 de vol'],['Volga / vomma',b.volga,'R$ / (1,00 de vol)²'],['Charm',b.charm,'delta / ano transcorrido']];
 return `<section class="card"><p class="eyebrow">PREÇO E SENSIBILIDADES</p><h2>Do modelo ao número</h2><div class="metric-row">${metric('Black–Scholes–Merton',money(b.price))}${metric('CRR europeia',money(european),d.steps+' passos')}${metric('CRR americana',money(american),'Exercício em cada nó')}</div>${treeError?`<div class="error">${esc(treeError)}</div>`:''}${b.boundary?'<div class="callout warning">Caso limite: preço pelo valor intrínseco ou fluxo determinístico. Gregas no kink não são derivadas suaves; zeros são convenções de exibição.</div>':''}<div class="table-scroll"><table><thead><tr><th>Grega BSM</th><th>Valor</th><th>Unidade</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${num(r[1],6)}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section><div class="grid two" style="margin-top:20px"><section class="card"><h3>Volatilidade implícita</h3><div class="metric-row">${metric('IV europeia — bisseção',iv===undefined?'Fora do domínio':num(iv*100,4)+'%')}</div>${ivError?`<p class="error">${esc(ivError)}</p>`:''}<p class="caption">Limites europeus: ${money(lim.lower)} ≤ preço &lt; ${money(lim.upper)} para IV finita. O solver não infere IV de uma americana.</p></section><section class="card"><h3>Monte Carlo europeu</h3><div class="metric-row">${metric('Estimativa descontada',money(mc.price))}${metric('Erro padrão',num(mc.se,4))}</div><p class="caption">IC aproximado de 95%: [${num(mc.low,4)}, ${num(mc.high,4)}]. ${d.paths} amostras GBM; semente ${d.seed}. Erro ∝ 1/√N; o intervalo não cobre incerteza do modelo.</p></section></div><div class="callout">BSM supõe volatilidade constante, dinâmica lognormal, mercados sem fricção e exercício europeu. A árvore trata exercício americano com dividend yield contínuo; não incorpora proventos discretos. T é ACT/365 didático, sem reproduzir convenções de um contrato B3.</div>`;}
function greeksOutput(p,d){const xs=range(Math.max(.01,p.S*.4),p.S*1.6),times=[p.T,Math.max(p.T/2,.00001),Math.max(p.T/10,.00001)];const series=times.map(t=>({name:`${num(t*365,1)} dias`,points:xs.map(S=>[S,F.bsm({...p,S,T:t})[d.greek]])}));const vs=range(.01,1.2),volSeries=[{name:'Sensibilidade à vol',points:vs.map(sigma=>[sigma*100,F.bsm({...p,sigma})[d.greek]])}];
 return `<section class="card"><p class="eyebrow">SENSIBILIDADE · ${esc(d.greek)}</p><h2>O risco muda com o mercado</h2>${chart(series,{yLabel:d.greek,title:'Grega por spot e prazo'})}${chartTable(series)}<div class="callout">Spot desloca moneyness; prazo menor concentra gamma perto do strike. A mesma grega pode mudar de sinal conforme opção e região. Theta usa avanço do calendário, mantendo spot e vol; vega e rho são por 1 ponto percentual.</div><h3>Variando apenas a volatilidade</h3>${chart(volSeries,{xLabel:'Volatilidade (% a.a.)',yLabel:d.greek,height:230})}${chartTable(volSeries,'Vol %')}<p class="caption">Vanna = ∂Δ/∂σ; volga = ∂²V/∂σ²; charm = ∂Δ/∂t, com σ decimal e t em anos. Curvas BSM europeias; não incluem movimentação da superfície.</p></section>`;}
function stressOutput(p,d){const shifts=[-.2,-.1,0,.1,.2],vols=[-.1,-.05,0,.05,.1],matrix=vols.map(v=>shifts.map(s=>F.stress(legs,p,p.S*s,v,d.elapsed)));return `<section class="card"><p class="eyebrow">CARTEIRA DO CONSTRUTOR · ${legs.length} PERNAS</p><h2>Quando as premissas mudam juntas</h2><p class="caption">A matriz utiliza a última carteira montada no construtor. Valores em R$ totais, com quantidades e multiplicadores. Spot nas colunas; choque de vol nas linhas.</p><div class="table-scroll"><table class="heat"><caption class="sr-only">P&L por choque de spot e volatilidade</caption><thead><tr><th>Vol / Spot</th>${shifts.map(s=>`<th>${s>0?'+':''}${s*100}%</th>`).join('')}</tr></thead><tbody>${matrix.map((row,i)=>`<tr><th>${vols[i]>0?'+':''}${num(vols[i]*100,0)} p.p.</th>${row.map(r=>{const value=d.method==='error'?r.full-r.approx:r[d.method];return `<td style="background:${value>=0?'#e0eee3':'#f4ded8'};color:${value>=0?'#175a41':'#8b3037'}" title="Completa ${num(r.full)}; gregas ${num(r.approx)}">${num(value)}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="formula">ΔV ≈ Δ·ΔS + ½Γ·(ΔS)² + Vega₍pp₎·Δσ₍pp₎ + Θ₍ano₎·Δt</div><p>Vega recebe o choque em pontos percentuais. Theta recebe dias/365. A aproximação omite termos cruzados e ordens superiores; desvios crescem em choques grandes, perto do vencimento e em regiões de convexidade elevada.</p><div class="callout">Reprecificação usa a mesma hipótese de vol para todas as pernas. Não é uma superfície de skew. O horizonte é limitado ao primeiro vencimento, pois liquidações anteriores dependem do caminho.</div><div class="table-scroll"><table><thead><tr><th>Choque spot</th><th>Choque vol</th><th>Completa</th><th>Gregas</th><th>Diferença</th></tr></thead><tbody>${matrix.flatMap((row,i)=>row.map((r,j)=>`<tr><td>${shifts[j]*100}%</td><td>${num(vols[i]*100,0)} p.p.</td><td>${num(r.full)}</td><td>${num(r.approx)}</td><td>${num(r.full-r.approx)}</td></tr>`)).join('')}</tbody></table></div></section>`;}
function hedgeOutput(p,d){const sim=F.hedge(p,{seed:d.seed,steps:d.pathSteps,every:d.every,costBps:d.costBps,realized:d.realized/100,drift:d.drift/100});lastHedge=sim;const series=[{name:'Vendido na opção + hedge',points:sim.rows.map(r=>[r.step,r.hedged])},{name:'Vendido na opção sem hedge',points:sim.rows.map(r=>[r.step,r.unhedged])}];return `<section class="card"><p class="eyebrow">UMA OPÇÃO VENDIDA · MULTIPLICADOR 1</p><h2>Delta neutro exige manutenção</h2><div class="metric-row">${metric('P&L final com hedge',money(sim.hedged))}${metric('P&L final sem hedge',money(sim.unhedged))}${metric('Custos somados',money(sim.totalCost))}</div>${chart(series,{xLabel:'Passo do caminho',title:'P&L com e sem hedge'})}${chartTable(series,'Passo',Math.max(1,Math.floor(d.pathSteps/12)))}${chart([{name:'Spot simulado',points:sim.rows.map(r=>[r.step,r.S])}],{xLabel:'Passo',yLabel:'Spot (R$)',height:220,zero:false})}<div class="callout">No início, a venda da opção financia a compra de delta ações; o saldo pode ser dívida. A cada passo, o caixa rende/paga a taxa r e recebe/paga dividendos. Operações pagam |Δações × spot| × bps/10.000. No vencimento, zeramos ações e descontamos o payoff da opção.</div><div class="metric-row">${metric('Juros líquidos',money(sim.totalInterest))}${metric('Dividendos líquidos',money(sim.totalDiv))}${metric('Prêmio recebido',money(sim.premium))}</div><p class="caption">A vol do caminho gera a difusão; a vol do modelo determina os deltas. Um único caminho não estima lucro esperado. O modelo não inclui margem, empréstimo de ações separado, gaps, spread variável ou impacto. Dividendos aproximados por yield por passo. Custos totais são a soma nominal; financiamento deles já afeta o caixa.</p><button id="export-hedge">Exportar fluxos em CSV ↓</button><details><summary>Auditar fluxos de caixa por passo</summary><div class="table-scroll"><table><thead><tr><th>Passo</th><th>Spot</th><th>Ações</th><th>Negociação</th><th>Juros</th><th>Dividendo</th><th>Custo</th><th>Caixa</th><th>P&L</th></tr></thead><tbody>${sim.rows.map(r=>`<tr>${['step','S','delta','trade','interest','dividend','cost','cash','hedged'].map(k=>`<td>${num(r[k],k==='step'?0:4)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></section>`;}
function barrierOutput(p,d){if(d.S<=0||d.terminal<=0||d.K<=0||d.barrier<=0)throw Error('Spot, strike, terminal e barreira precisam ser positivos.');const a=F.barrierPath({S:d.S,terminal:d.terminal,seed:d.seed,amplitude:.04,bump:0}),b=F.barrierPath({S:d.S,terminal:d.terminal,seed:d.seed,amplitude:.04,bump:d.bump}),args={K:d.K,barrier:d.barrier,direction:d.direction,knock:d.knock,type:d.type,rebate:d.rebate},ra=F.barrierResult(a,args),rb=F.barrierResult(b,args),series=[{name:'Caminho A',points:a.map((s,i)=>[i,s])},{name:'Caminho B',points:b.map((s,i)=>[i,s])}];return `<section class="card"><p class="eyebrow">SIMULADOR DE PAYOFF · NÃO É UM PRECIFICADOR</p><h2>O destino não conta toda a história</h2>${chart(series,{xLabel:'Observação discreta',yLabel:'Spot (R$)',zero:false,levels:[{value:d.barrier,label:'Barreira '+num(d.barrier)}]})}${chartTable(series,'Observação',5)}<div class="grid two">${[ra,rb].map((r,i)=>`<div class="barrier-state"><h3>Caminho ${i?'B':'A'}</h3><p>${r.touched?'Toque observado no passo '+r.touchIndex:'Nenhum toque observado'} · ${r.active?'Opção ativa no vencimento':'Opção inativa no vencimento'}</p><strong>Pagamento: ${money(r.payoff)}</strong></div>`).join('')}</div><div class="callout warning">Monitoramento discreto em 61 observações, incluindo início e vencimento; igualdade conta como toque. Toques entre observações não são detectados. Um contrato de monitoramento contínuo pode produzir outro resultado.</div><p>Ambos os caminhos terminam em ${money(d.terminal)}. O caminho B acrescenta uma excursão controlada que desaparece no final. O rebate é pago apenas se a opção terminar inativa e sempre no vencimento: esta é a convenção didática deste simulador.</p><p class="caption">Caminhos ilustrativos condicionados ao mesmo terminal, sem interpretação de probabilidade neutra ao risco. Pagamentos brutos, sem prêmio, desconto ou preço de uma barreira. Autocallables e outros estruturados são tratados nas aulas e casos.</p></section>`;}

function assessment(){return header('Faça o conhecimento aparecer.','Avalie fundamentos, revise erros e resolva casos que conectam preço, risco e comunicação.','AVALIAÇÕES')+`<div class="grid three"><section class="card"><p class="eyebrow">PONTO DE PARTIDA</p><h2>Diagnóstico inicial</h2><p>Uma amostra de todos os módulos para identificar familiaridade e lacunas. O resultado orienta a trilha, sem bloquear aulas.</p><button class="primary" data-go="quiz/diagnostic">Iniciar diagnóstico →</button></section><section class="card"><p class="eyebrow">CONSOLIDAÇÃO</p><h2>Avaliação final</h2><p>Questões de todos os temas e casos integradores. Combine teoria, cálculos e explicação de riscos para clientes fictícios.</p><button data-go="quiz/final">Iniciar avaliação final →</button></section><section class="card"><p class="eyebrow">PRÁTICA DIRECIONADA</p><h2>Revisão dos erros</h2><p>${incorrectQuestions().length} questões com último resultado incorreto; ${dueQuestions().length} revisões espaçadas disponíveis hoje.</p><div class="toolbar"><button data-go="quiz/errors">Rever erros</button><button data-go="quiz/review">Revisão espaçada</button></div></section></div><div class="section-head"><h2>Provas por módulo</h2><span class="caption">Gabarito após entrega · livre consulta</span></div><div class="grid three">${C.modules.map((m,i)=>`<article class="card"><span class="badge">${String(i+1).padStart(2,'0')}</span><h3 style="margin-top:16px">${esc(m.title)}</h3><p class="caption">${C.questions.filter(q=>lessonById(q.lessonId)?.moduleId===m.id).length} questões · objetivas e casos abertos</p><button data-go="quiz/module/${m.id}" class="small">Abrir prova →</button></article>`).join('')}</div>`;}
function makeQuiz(parts){const type=parts[1],id=parts[2];let qs=[],title='',desc='';if(type==='lesson'){const l=lessonById(id);if(!l)return null;qs=C.questions.filter(q=>q.lessonId===id);title='Prática: '+l.title;}else if(type==='module'){const m=moduleById(id);if(!m)return null;qs=C.questions.filter(q=>lessonById(q.lessonId)?.moduleId===id);title='Prova: '+m.title;}else if(type==='diagnostic'){for(const m of C.modules){const l=C.lessons.filter(l=>l.moduleId===m.id),pool=C.questions.filter(q=>l.some(x=>x.id===q.lessonId)&&q.type!=='open');qs.push(pool[0],pool[Math.floor(pool.length/2)]);}title='Diagnóstico inicial';desc='18 questões para encontrar seu ponto de partida. Uma amostra não certifica domínio de todo o programa.';}else if(type==='final'){for(const m of C.modules){for(const l of C.lessons.filter(l=>l.moduleId===m.id)){const pool=C.questions.filter(q=>q.lessonId===l.id&&q.type!=='open');qs.push(pool.at(-1));}}const cases=C.questions.filter(q=>q.type==='open'&&lessonById(q.lessonId)?.moduleId===C.modules.at(-1).id);qs.push(...cases);title='Avaliação final';desc='Integre os nove módulos. Casos abertos exigem autoavaliação pela rubrica e não compõem a nota objetiva.';}else if(type==='errors'){qs=incorrectQuestions();title='Revisão dos erros';}else if(type==='review'){qs=dueQuestions();title='Revisão espaçada';}else return null;
 const seed=Date.now()>>>0;return {key:parts.join('/'),title,desc,questions:qs.filter(Boolean).map((q,i)=>P.variant(q,seed+i*7919)),answers:{},submitted:false,result:null,started:Date.now()};}
function quiz(parts){const key=parts.join('/');if(!sessions.has(key)){const q=makeQuiz(parts);if(!q)return missing();sessions.set(key,q);}currentQuiz=sessions.get(key);const qz=currentQuiz;
 if(!qz.questions.length)return header(qz.title,'Nenhuma questão pendente neste momento.','REVISÃO')+'<div class="empty">Continue estudando. Suas respostas definirão as próximas revisões.<br><a href="#course">Voltar à trilha →</a></div>';
 return header(qz.title,qz.desc||'Resolva com calma. Entregue para consultar a correção explicada e a rubrica dos casos.','AVALIAÇÃO · '+qz.questions.length+' QUESTÕES',`<span class="tag">${qz.submitted?'CORREÇÃO DISPONÍVEL':'GABARITO APÓS ENTREGA'}</span>`)+(qz.submitted?quizResult(qz):'<div class="callout">Respostas ficam nesta sessão até a entrega. Recarregar a página descarta uma avaliação ainda não entregue. A entrega registra as tentativas neste navegador.</div>')+`<form id="quiz-form">${qz.questions.map((q,i)=>questionHTML(q,i,qz)).join('')}<div id="quiz-error" role="alert"></div><div class="toolbar">${qz.submitted?'<button type="button" id="new-attempt" class="primary">Nova tentativa / novos parâmetros ↻</button><button type="button" data-go="course">Voltar à trilha</button>':'<button class="primary" type="submit">Entregar e ver correção →</button>'}</div></form>`;}
function questionHTML(q,i,qz){const a=qz.answers[q.id],disabled=qz.submitted?'disabled':'';let input='';if(q.type==='choice')input=q.options.map((s,j)=>`<label class="choice"><input type="radio" name="${q.id}" value="${j}" ${String(a)===String(j)?'checked':''} ${disabled}><span>${String.fromCharCode(65+j)}. ${esc(s)}</span></label>`).join('');if(q.type==='number')input=`<label><span class="sr-only">Resposta numérica da questão ${i+1}</span><input class="number-answer" type="text" inputmode="decimal" name="${q.id}" value="${esc(a??'')}" placeholder="Sua resposta numérica" ${disabled}></label><p class="caption" style="margin-top:9px">Tolerância absoluta: ±${num(q.tolerance||0,4)}. Use vírgula ou ponto decimal; sem separador de milhar.</p>`;if(q.type==='open')input=`<label><span class="sr-only">Resposta aberta da questão ${i+1}</span><textarea name="${q.id}" placeholder="Explique sua decisão, as premissas e os riscos…" ${disabled}>${esc(a||'')}</textarea></label><p class="caption">Autoavaliação por rubrica após a entrega. Sem correção automática por IA.</p>`;
 let feedback='';if(qz.submitted){const correct=P.grade(q,a);feedback=`<div class="feedback"><span class="pill ${correct===true?'good':correct===false?'bad':''}">${correct===null?'Autoavaliação · sem nota automática':correct?'Resposta correta':'Revisar este conceito'}</span>${q.type!=='open'?`<p style="margin-top:12px"><strong>Resposta: ${q.type==='choice'?String.fromCharCode(65+q.answer)+'. '+esc(q.options[q.answer]):num(q.answer,4)}</strong></p><p>${esc(q.explanation)}</p>`:`<h3 style="margin-top:16px">Resposta comentada</h3><p>${esc(q.sample||q.explanation)}</p><h3>Rubrica de autoavaliação</h3><ul>${(q.rubric||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="caption">Compare cada critério com sua resposta: ausente, parcial ou sustentado. A plataforma não atribui pontuação a esse julgamento.</p>`}${q.type==='choice'&&q.optionReasons?`<ul>${q.options.map((s,j)=>`<li><strong>${String.fromCharCode(65+j)}:</strong> ${esc(q.optionReasons[j]||'')}</li>`).join('')}</ul>`:''}<a href="#lesson/${q.lessonId}">Revisar a aula correspondente →</a></div>`;}
 return `<section class="question"><p class="eyebrow">QUESTÃO ${String(i+1).padStart(2,'0')} · ${q.type==='open'?'CASO ABERTO':q.type==='number'?'CÁLCULO':'CONCEITO'} · NÍVEL ${q.difficulty}</p><h3>${esc(q.prompt)}</h3>${input}${feedback}</section>`;}
function quizResult(qz){const obj=qz.questions.filter(q=>q.type!=='open'),correct=obj.filter(q=>P.grade(q,qz.answers[q.id])).length;return `<div class="card"><div class="metric-row">${U.metric('Acerto nas questões objetivas',obj.length?Math.round(100*correct/obj.length)+'%':'—')}${U.metric('Corretas / objetivas',correct+' / '+obj.length)}${U.metric('Casos para autoavaliação',String(qz.questions.length-obj.length))}</div><p class="caption">O resultado desta tentativa não equivale ao domínio completo da trilha. Veja o detalhamento por aula em Meu progresso. Próxima recomendação: <a href="#lesson/${recommendations().id}">${esc(recommendations().title)}</a>.</p></div>`;}
function reference(parts){const tab=parts[1]||'glossary';return header('Uma referência ao seu alcance.','Termos, fórmulas e fontes para consultar durante a trilha e na bancada.','BIBLIOTECA')+`<div class="tabs">${[['glossary','Glossário'],['formulas','Formulário'],['sources','Fontes e convenções']].map(([id,t])=>`<button class="${tab===id?'active':''}" data-go="reference/${id}">${t}</button>`).join('')}</div>`+(tab==='formulas'?C.formulas.map(f=>`<section class="card" style="margin:18px 0"><h2>${esc(f.name)}</h2><div class="formula">${esc(f.expression)}<small>${esc(f.variables)}</small></div></section>`).join(''):tab==='sources'?`<div class="callout warning">Não foram encontrados PDFs do Hull ou do Natenberg nesta pasta. As referências aos livros são temáticas; não afirmamos consulta integral nem atribuímos páginas ou capítulos não verificados. Fontes web consultadas durante a criação em 16/11/2026.</div><div class="grid two">${C.sources.map(s=>`<article class="card"><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener">Consultar fonte ↗</a></article>`).join('')}</div><div class="callout">Convenção dos laboratórios: taxas contínuas, dias corridos/365, dividendos por yield, quantidades e multiplicadores explícitos. Essas hipóteses não substituem o regulamento de cada série, calendários, ajustes de proventos, margens ou procedimentos da B3. Fontes externas exigem internet.</div>`:`<div class="glossary-grid">${C.glossary.filter(g=>!parts[2]||g.term===decodeURIComponent(parts[2])).map(g=>`<article class="card"><h3>${esc(g.term)}</h3><p>${esc(g.definition)}</p></article>`).join('')}</div>${parts[2]?'<div class="toolbar"><a href="#reference">Ver glossário completo →</a></div>':''}`);}
function progressView(){const attempts=progress.state.attempts,objective=attempts.filter(a=>a.correct!==null);return header('Seu aprendizado, com evidências.','Leitura, tentativas e revisões são registros distintos. Seu histórico fica somente neste navegador.','MEU PROGRESSO')+`<div class="grid four">${stat('Aulas lidas',String(progress.state.read.length),'Registro manual de leitura')}${stat('Domínio demonstrado',String(C.lessons.filter(l=>master(l.id).demonstrated).length),'≥ 80% das questões objetivas únicas')}${stat('Tentativas objetivas',String(objective.length),'Todas as entregas registradas')}${stat('Revisões vencidas',String(dueQuestions().length),'Intervalos de 1, 3, 7, 14 e 30 dias')}</div><div class="toolbar"><button class="primary" id="export-progress">Exportar backup JSON ↓</button><label class="field" style="margin:0"><span class="sr-only">Restaurar backup JSON</span><input type="file" id="import-progress" accept="application/json,.json" aria-label="Restaurar backup JSON"></label><button data-go="quiz/review">Revisar agora →</button></div><p class="caption">Importar restaura o histórico do arquivo e substitui o histórico atual deste navegador. Exporte antes se quiser manter ambos. Backups não contêm credenciais. Trocar de navegador, origem ou caminho do HTML pode mudar o armazenamento.</p><div id="import-status" role="status"></div><div class="section-head"><h2>Desempenho por assunto</h2></div><div class="card"><div class="table-scroll"><table><thead><tr><th>Aula</th><th>Leitura</th><th>Últimas respostas</th><th>Domínio</th><th>Próxima ação</th></tr></thead><tbody>${C.lessons.map(l=>{const g=master(l.id);return `<tr><td><a href="#lesson/${l.id}">${esc(l.title)}</a></td><td>${progress.state.read.includes(l.id)?'Lida':'—'}</td><td>${g.correct} / ${g.total}</td><td><span class="pill ${g.demonstrated?'good':''}">${g.percent}%</span></td><td><a href="#quiz/lesson/${l.id}">Praticar →</a></td></tr>`;}).join('')}</tbody></table></div></div><div class="section-head"><h2>Histórico de tentativas</h2><span class="caption">Mais recentes primeiro · até 100 na tela</span></div>${attempts.length?`<div class="card table-scroll"><table><thead><tr><th>Data</th><th>Aula</th><th>Questão</th><th>Resultado</th></tr></thead><tbody>${attempts.slice(-100).reverse().map(a=>`<tr><td>${esc(new Date(a.time).toLocaleString('pt-BR'))}</td><td>${esc(lessonById(a.lessonId)?.title||a.lessonId)}</td><td>${esc(a.id)}</td><td>${a.correct===null?'Aberta · autoavaliação':a.correct?'Correta':'Revisar'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">O histórico aparece após a primeira entrega de uma avaliação.</div>'}`;}
function missing(){return header('Página não encontrada.','Escolha uma aula ou ferramenta na navegação.')+'<a href="#home">Voltar ao início →</a>';}
function render(){document.body.classList.remove('menu-open');route=(location.hash.slice(1)||'home');const parts=route.split('/'),section=parts[0];if(section!=='lesson')document.body.classList.remove('focus');let content,navSection=section;switch(section){case'home':content=dashboard();break;case'course':content=course(parts[1]);break;case'lesson':content=lesson(parts[1]);navSection='course';break;case'labs':content=labs();break;case'lab':content=Labs.view(parts[1]);navSection='labs';break;case'assessment':content=assessment();break;case'quiz':content=quiz(parts);navSection='assessment';break;case'reference':content=reference(parts);break;case'progress':content=progressView();break;default:content=missing();}shell(content,navSection);bind(parts);if(section==='lab')Labs.mount();window.scrollTo(0,0);document.title=(section==='lesson'?(lessonById(parts[1])?.title||'Aula'):nav.find(x=>x[0]===navSection)?.[1]||'Delta Lab')+' · Delta Lab';}
function bind(parts){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=()=>document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'auto'}));document.getElementById('focus-toggle')?.addEventListener('click',()=>document.body.classList.toggle('focus'));document.getElementById('mark-read')?.addEventListener('click',e=>{progress.read(parts[1]);e.target.textContent='✓ Aula registrada como lida';U.toast(progress.warning||'Leitura registrada. O domínio é demonstrado nos exercícios.');});
 const form=document.getElementById('quiz-form');if(form&&currentQuiz){form.oninput=()=>{currentQuiz.answers=Object.fromEntries(new FormData(form));};form.onsubmit=e=>{e.preventDefault();if(currentQuiz.submitted)return;const answers=Object.fromEntries(new FormData(form));const unanswered=currentQuiz.questions.filter(q=>q.type!=='open'&&(answers[q.id]===undefined||String(answers[q.id]).trim()===''));const invalid=currentQuiz.questions.filter(q=>q.type==='number'&&answers[q.id]!==undefined&&String(answers[q.id]).trim()!==''&&!Number.isFinite(Number(String(answers[q.id]).replace(',','.'))));if(unanswered.length||invalid.length){const el=document.getElementById('quiz-error');el.innerHTML=`<div class="error">${unanswered.length?'Responda às '+unanswered.length+' questões objetivas pendentes. ':''}${invalid.length?'Use respostas numéricas válidas, sem símbolos de moeda.':''}</div>`;el.scrollIntoView();return;}currentQuiz.answers=answers;currentQuiz.submitted=true;const time=Date.now();for(const q of currentQuiz.questions)progress.record({id:q.id,lessonId:q.lessonId,type:q.type,time,correct:P.grade(q,answers[q.id]),value:answers[q.id]||'',variantSeed:q.variantSeed,assessment:currentQuiz.key});render();document.getElementById('main').focus();};document.getElementById('new-attempt')?.addEventListener('click',()=>{sessions.delete(currentQuiz.key);render();});}
 document.getElementById('export-progress')?.addEventListener('click',()=>{U.download('delta-lab-progresso-'+new Date().toLocaleDateString('sv-SE')+'.json',progress.export());U.toast('Backup exportado. Guarde uma cópia fora do navegador.');});document.getElementById('import-progress')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>8e6)throw Error('Backup muito grande.');progress.import(await file.text());sessions.clear();render();U.toast(progress.warning||'Backup restaurado e validado.');}catch(err){document.getElementById('import-status').innerHTML=`<div class="error">${esc(err.message)} O histórico anterior foi preservado.</div>`;}});
}
window.addEventListener('hashchange',()=>{render();document.getElementById('main').focus({preventScroll:true});});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open'))document.querySelector('.close-menu').click();});render();
})();

</script></body></html>
