'use strict';
const finite=(x,n)=>{if(!Number.isFinite(x))throw Error(`${n}: informe um número finito.`);};
function validate(p){
 for(const k of ['S','K','T','r','q','sigma'])finite(p[k],k);
 if(p.S<0||p.K<=0||p.T<0||p.sigma<0)throw Error('Spot ≥ 0, strike > 0, prazo e volatilidade ≥ 0.');
 if(!['call','put'].includes(p.type))throw Error('Tipo de opção inválido.');
 if(p.T>30||Math.abs(p.r)>2||Math.abs(p.q)>2||p.sigma>5||p.S>1e9||p.K>1e9)throw Error('Entrada fora do domínio didático (30 anos, taxas ±200%, vol 500%).');
}
const pdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function cdf(x){const a=Math.abs(x),t=1/(1+0.2316419*a);const n=1-pdf(a)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return x>=0?n:1-n;}

 validate(p);const {S,K,T,r,q,sigma,type}=p,z=type==='call'?1:-1;

  const delta=diff>0?z*Math.exp(-q*T):diff<0?0:z*0.5*Math.exp(-q*T);
  return {price,delta,gamma:0,theta:diff>0?z*(q*s-r*k):0,thetaDay:diff>0?z*(q*s-r*k)/365:0,vega:0,rho:diff>0?z*k*T/100:0,vanna:0,volga:0,charm:diff>0?q*delta:0,boundary:true};
 }

 return {price,delta,gamma,theta,thetaDay:theta/365,vega:vegaRaw/100,rho:z*K*T*er*cdf(z*d2)/100,vanna:-eq*pdf(d1)*d2/sigma,volga:vegaRaw*d1*d2/sigma,charm,d1,d2,boundary:false};
}
function binomial(p,steps=300,american=false){
 validate(p);if(!Number.isInteger(steps)||steps<1||steps>1500)throw Error('Árvore: use 1 a 1500 passos inteiros.');

 const dt=T/steps,u=Math.exp(sigma*Math.sqrt(dt)),d=1/u,prob=(Math.exp((r-q)*dt)-d)/(u-d),disc=Math.exp(-r*dt);

function legValidate(l){

add({id:'f3',moduleId:'foundations',title:'Liquidação, multiplicador e risco operacional',minutes:30,level:'Fundamental',prerequisites:['f1','f2'],objectives:['Converter cotação em exposição monetária.','Diferenciar prêmio, margem e garantia.','Separar convenções brasileiras e conceitos universais.'],intuition:'A melhor conta de payoff falha se o contrato que chega à liquidação não for o contrato que você imaginou.',theory:[
'Liquidação financeira paga uma diferença; liquidação física envolve entrega e pagamento do ativo. Exercício pode criar uma posição em ações que exige caixa, empréstimo ou entrega. Encerrar uma opção antes do vencimento é uma negociação secundária, não um exercício. A documentação define referência de preço, ajustes por eventos corporativos, unidades e prazos operacionais. Por isso a identificação completa da série faz parte da análise de risco.',
'A B3 informa que opções sobre ações podem ter estilo europeu ou americano. O tamanho e o fator de cotação devem ser confirmados no instrumento: não importe automaticamente o multiplicador 100 de exemplos americanos. A página de produto indica vencimento mensal na terceira sexta-feira; há também séries semanais nas demais sextas-feiras. Feriados, séries específicas e procedimentos devem ser conferidos no calendário e nos avisos vigentes. O exercício automático de posições ITM admite procedimentos de bloqueio e exceções previstos pela bolsa; as janelas do intermediário também precisam ser verificadas.',
'Margem é proteção contra inadimplência, não prêmio nem perda máxima. O modelo de risco da câmara e os adicionais do intermediário podem mudar a exigência com spot, volatilidade e composição da carteira. Uma venda coberta remove a necessidade de comprar a ação numa alta para entregar, mas mantém a perda econômica da ação numa queda. Alavancagem deve ser avaliada em cenários e chamadas de caixa, não apenas como notional dividido pelo prêmio.'
],formula:{expression:'Valor monetário = cotação × quantidade × multiplicador; notional de referência = S × quantidade × multiplicador',variables:'Cotação e S em R$/unidade. Multiplicador converte um contrato em unidades econômicas; confirmar fator de cotação da série.'},example:{title:'Uma garantia não limita o risco',steps:['Venda fictícia de 5 calls, multiplicador 10, prêmio R$ 2 e K = 50: entrada R$ 100.','Se o spot termina em 70, obrigação econômica = (70 − 50) × 50 = R$ 1.000.','P&L = 100 − 1.000 = −R$ 900, antes de custos.','Mesmo se a garantia inicial fosse R$ 300, a perda continuaria sendo R$ 900. Margem não é seguro.']},desk:'Use uma checklist de série: ativo, vencimento, estilo, fator de cotação, quantidade, liquidação, proventos, posição coberta e horário limite do intermediário.',mistakes:['Aplicar multiplicador 100 a qualquer opção brasileira.','Tratar margem depositada como perda máxima.','Usar somente o vencimento mensal ao pesquisar uma série semanal.'],references:['b3-equity','b3-weekly','b3-calendar'],lab:'strategy'},[
choice('Qual informação NÃO pode ser inferida do valor de margem inicial?',['Garantia exigida naquele momento.','Perda máxima econômica do contrato.','Necessidade inicial de recursos para garantias.'],1,'Margem pode ser recalculada e não limita a obrigação contratual.',['A margem informa essa exigência, sujeita a alterações.','Correto: a perda pode superar a margem.','A exigência inicial é uma necessidade de recursos, embora ativos elegíveis possam ser aceitos.']),
num('Prêmio cotado a R$ 1,80, 12 contratos e multiplicador 10. Qual o desembolso de prêmio?',216,'1,80 × 12 × 10 = R$ 216.',0.01,1),
choice('Para uma série brasileira, qual procedimento é correto?',['Assumir sempre 100 ações por contrato.','Assumir que toda opção é americana.','Conferir especificações, calendário e procedimentos da série.'],2,'Conceitos universais não substituem a especificação operacional.',['A convenção não é universal.','A B3 admite estilos distintos.','Correto: esses dados determinam fluxo e risco.']),
num('Uma carteira tem 4 contratos, multiplicador 25 e delta unitário 0,60. A quantas ações equivale seu delta?',60,'4 × 25 × 0,60 = 60 ações equivalentes.',0.01,2),
open('Uma call vendida vai expirar ITM. Liste verificações antes do fechamento.',['Estilo, liquidação e exercício automático/bloqueio.','Estoque e caixa para entrega.','Horário do intermediário, proventos e hedge residual.'],'Confirme a série e a posição líquida, as regras vigentes de exercício e o prazo do intermediário. Verifique ações disponíveis, empréstimo e caixa; simule a posição após assignment. Não presuma que uma intenção verbal de encerrar substitui uma ordem executada.')
]);

add({id:'a1',moduleId:'arbitrage',title:'Taxas, dividendos e custo de carregamento',minutes:40,level:'Intermediário',prerequisites:['f3'],objectives:['Converter convenções de taxa.','Calcular forward com yield ou dividendos discretos.','Distinguir preço de entrega e valor de contrato.'],intuition:'Comprar depois e comprar agora com financiamento devem ter custos compatíveis, depois de considerar a renda de quem carrega a ação.',theory:[
'Uma taxa precisa de base temporal e regime. Em capitalização contínua, um real cresce para e^(rT); em taxa efetiva anual, cresce para (1+i)^T. As taxas equivalentes satisfazem r = ln(1+i). Não coloque uma taxa efetiva brasileira diretamente no parâmetro contínuo de Black–Scholes. Dias corridos/365 e dias úteis/252 produzem frações diferentes; taxa, volatilidade e prazo devem pertencer a convenções compatíveis.',
'Para um ativo com dividend yield contínuo q, a compra financiada tem carregamento líquido r − q. A igualdade de não arbitragem é F = S e^((r−q)T). Dividendos conhecidos em dinheiro são tratados pelo valor presente: F = (S − PV(D)) e^(rT). Um yield constante é uma aproximação agregada; não reproduz saltos ex-dividendo ou a decisão de exercício em torno de datas específicas. Proventos incertos também introduzem risco de estimativa.',
'No instante da contratação, o preço de entrega K pode ser escolhido para tornar o valor do forward zero. Depois, K permanece fixo e o valor varia: V = S e^(−qτ) − K e^(−rτ), por unidade, para o comprador. O novo preço forward e o valor do contrato antigo não são a mesma coisa. Para futuros, ajustes diários e correlação entre juros e ativo podem separar preço futuro e forward; a equivalência simples pressupõe juros determinísticos e condições de financiamento compatíveis.'
],formula:{expression:'F = S e^((r−q)T); V_forward = S e^(−qτ) − K e^(−rτ); r = ln(1+i)',variables:'r e q: taxas contínuas anuais em decimal; i: taxa efetiva anual; T e τ: anos; S, F, K e V: R$/ação.'},example:{title:'Forward e marcação do contrato antigo',steps:['S = 100, r = 10% contínuos, q = 2%, T = 0,5 ano.','F = 100 × e^(0,08 × 0,5) = R$ 104,0811.','Contrato antigo com K = 103 e mesmo prazo restante: V = 100e^(−0,01) − 103e^(−0,05).','V ≈ R$ 1,0283 por ação; equivale a (F − 103)e^(−0,05).']},desk:'Uma discrepância entre forward de tela e modelo pode refletir dividendos, empréstimo de ações, funding ou base de taxa. Reconcilie esses fatores antes de chamar a diferença de arbitragem.',mistakes:['Confundir F com valor de mercado de um contrato existente.','Misturar juros efetivos e contínuos.','Subtrair dividendo nominal sem respeitar sua data.'],references:['hull','oic-parity'],lab:'calculator'},[
num('S = 100, r = 5% contínuos, q = 0 e T = 1. Calcule F.',105.1271,'F = 100e^0,05 = 105,1271.',0.02,2,'forward'),
choice('Qual é a taxa contínua equivalente a 10% efetivos ao ano?',['10% exatamente.','ln(1,10), aproximadamente 9,531%.','e^0,10, aproximadamente 110,517%.'],1,'Equivalência exige e^r = 1,10.',['Regimes de capitalização diferem.','Correto: r = ln(1+i).','Isso é fator de acumulação de outra taxa, não a taxa equivalente.']),
num('Um dividendo conhecido de R$ 4 será pago em um ano; r = 0. Qual o forward de um ano de ação com S = 100?',96,'Com juros zero, PV(D) = 4 e F = 100 − 4 = R$ 96.',0.01,1),
choice('Se o novo forward é 110 e um contrato comprado antigo tem K = 100, seu valor hoje é:',['10, sempre.','O valor presente de 10 no prazo remanescente.','110.'],1,'O ganho de 10 é recebido no vencimento; precisa ser descontado.',['Só vale com juros zero.','Correto para o modelo sem fricções.','110 é o preço de entrega do novo contrato.']),
open('Duas mesas usam volatilidade de 252 dias e prazo em dias corridos. Como você reconcilia as contas?',['Identificar bases e anualização.','Converter consistentemente prazo/variância total.','Separar convenção de taxa de convenção de volatilidade.'],'Compare a variância total σ²T e o fator de desconto de cada mesa. A volatilidade anualizada por dias úteis pode requerer prazo útil; a curva de desconto segue sua própria convenção. Não corrija multiplicando números por 252/365 sem explicitar o objeto convertido.')
]);

add({id:'a2',moduleId:'arbitrage',title:'Paridade put–call, limites e sintéticos',minutes:40,level:'Intermediário',prerequisites:['a1','f2'],objectives:['Derivar paridade por fluxos terminais.','Testar limites de preços europeus.','Construir ação e forward sintéticos.'],intuition:'Se duas carteiras entregam os mesmos fluxos em todos os estados e datas, seus preços devem coincidir nas mesmas condições de financiamento.',theory:[
'Considere call comprada e put vendida com mesmo ativo, strike, vencimento e estilo europeu. Acima de K a call paga S_T − K; abaixo de K a put vendida paga S_T − K. Em todos os casos a soma vale S_T − K. Ela replica um forward comprado com preço de entrega K. Somando um título que paga K em T, obtemos uma ação pré-paga: seu preço hoje é S e^(−qT). Daí c − p = S e^(−qT) − K e^(−rT).',
'A mesma identidade permite obter uma put a partir de call, ação e caixa. Um sintético iguala fluxos, mas pode não igualar liquidez, tributação, margem ou capacidade de exercício. A paridade simples não é uma igualdade universal para americanas, pois exercício antecipado quebra a coincidência de datas. Também não compare call e put de vencimentos diferentes, nem prêmios com fatores de cotação diferentes.',
'Para europeias com yield contínuo, o limite inferior da call é max(S e^(−qT) − K e^(−rT),0) e o superior é S e^(−qT); para a put, são max(K e^(−rT) − S e^(−qT),0) e K e^(−rT). Uma call abaixo do limite pode ser comprada junto de uma posição que trava o ganho; acima do limite, pagar mais que o ativo pré-pago é incoerente. No solver de volatilidade, os limites são filtros indispensáveis: um preço fora deles não tem uma volatilidade BSM válida.'
],formula:{expression:'c − p = S e^(−qT) − K e^(−rT); 0 ≤ c ≤ S e^(−qT); 0 ≤ p ≤ K e^(−rT)',variables:'c e p: prêmios europeus por unidade, mesmo K e T; S: spot; r e q contínuos anuais; T em anos.'},example:{title:'Recuperar o preço de uma put',steps:['S = 100, K = 100, r = q = 0, mesma data de vencimento. A call custa 7.','Paridade: c − p = 100 − 100 = 0; portanto p = 7.','Se a put custa 9, comprar call e vender put recebe 2 e replica S_T − 100.','Vender a ação por 100 e reservar 100 para recomprar/entregar fecha os fluxos ideais; custos e empréstimo precisam ser incorporados antes de executar.']},desk:'Use a paridade para detectar dados desalinhados e inferir forward implícito. Uma violação aparente frequentemente é timestamp, bid/ask, provento ou estilo errado.',mistakes:['Usar mid de todas as pernas como preço executável.','Ignorar dividendos e empréstimo de ações.','Aplicar igualdade europeia a qualquer americana.'],references:['oic-parity','hull'],lab:'calculator'},[
num('S = K = 100, r = q = 0. Call europeia vale 6. Qual deve ser o preço da put de mesmo prazo?',6,'c − p = S − K = 0, então p = 6.',0.01,1,'parity'),
choice('Call comprada mais put vendida, com mesmo K e T, replica:',['Um forward comprado com entrega a K.','Uma posição sem risco em caixa.','Uma put comprada.'],0,'O fluxo conjunto é S_T − K para qualquer S_T.',['Correto: exposição linear, não opcional.','O resultado depende de S_T.','A put teria payoff max(K − S_T,0).']),
num('Call europeia: S = 120, K = 100, juros e dividendos zero. Qual seu limite inferior?',20,'max(120 − 100,0) = R$ 20.',0.01,1),
choice('Um solver recebeu preço de call maior que S e^(−qT). O comportamento adequado é:',['Retornar volatilidade negativa.','Aumentar volatilidade indefinidamente e aceitar o resultado.','Rejeitar preço incompatível com o modelo.'],2,'A call não pode ultrapassar o valor do ativo pré-pago no modelo.',['Volatilidade negativa não tem interpretação no BSM.','O limite superior é assintótico; o preço está fora do domínio.','Correto: dados ou modelo precisam ser revisados.']),
open('Explique como usar a paridade para checar dados, sem presumir arbitragem executável.',['Mesmos ativo, K, T e estilo.','Spot/forward, taxas e dividendos sincronizados.','Bid/ask, custos, funding e short borrow.'],'Primeiro harmonize os contratos e os horários. Calcule os lados com fatores de desconto e proventos coerentes. Depois avalie comprar ao ask e vender ao bid, incluindo financiamento e empréstimo. Um erro do mid contra a fórmula é um alerta de investigação, não prova de lucro disponível.')
]);

add({id:'a3',moduleId:'arbitrage',title:'Boxes, conversões e a arbitragem executável',minutes:40,level:'Intermediário',prerequisites:['a2'],objectives:['Decompor box, conversão e reversão.','Calcular taxa implícita.','Reconhecer restrições de funding e exercício.'],intuition:'Um fluxo certo no vencimento pode ser um empréstimo disfarçado. O risco reaparece quando as pernas não liquidam nas condições usadas na prova.',theory:[
'Um long box europeu combina bull call spread e bear put spread com strikes K1 < K2 e mesmo vencimento. Em todos os estados paga K2 − K1. Seu preço ideal é essa diferença descontada. Comprar o box corresponde a aplicar capital; vender o box equivale a captar. A taxa implícita contínua é ln((K2−K1)/preço)/T. Não há necessidade de prever a ação para entender o fluxo, mas há necessidade de verificar todas as pernas.',
'Uma conversão combina ação comprada, put comprada e call vendida no mesmo strike e vencimento: no terminal, ação + put − call vale K, além dos proventos que pertencem à ação ao longo do caminho. A reversão inverte os sinais e exige venda/locação do ativo. Custos de empréstimo e disponibilidade podem impedir o fechamento da operação. Para instrumentos americanos, exercício antecipado pode romper o cronograma do financiamento.',
'Arbitragem teórica assume execução simultânea, preços disponíveis para a quantidade desejada, mesma curva para aplicação e captação, venda a descoberto possível e custos desprezíveis. Uma mesa real trabalha com bid/ask, haircuts, limites de crédito, risco de legging e capital econômico. Quantifique a folga líquida e faça cenários de caixa. Uma aparente rentabilidade elevada de box americano pode ser prêmio por assignment e necessidade de funding, não uma aplicação equivalente a um título sem risco.'
],formula:{expression:'Box_T = K2 − K1; preço justo = (K2 − K1)e^(−rT); r_impl = ln((K2 − K1)/B0)/T',variables:'K1 e K2 em R$/ação; B0: débito inicial do box por unidade; T: anos; r_impl: taxa contínua anual.'},example:{title:'Funding implícito no box',steps:['Box europeu de strikes 90 e 110, prazo de um ano, custa R$ 19.','Pagamento terminal fixo = 110 − 90 = R$ 20.','Retorno efetivo = 20/19 − 1 = 5,2632%; taxa contínua = ln(20/19) = 5,1293%.','Se custos totais elevam o débito para 19,40, retorno efetivo cai para 3,0928%. Compare com alternativas de risco e liquidez semelhantes.']},desk:'Apresente o cronograma de caixa de cada perna e uma taxa líquida. Confirme exercício, contraparte, garantias e disponibilidade do ativo antes de tratar o pacote como financiamento.',mistakes:['Chamar todo box de renda fixa sem risco.','Comparar taxa contínua com CDI efetivo sem converter.','Ignorar execução parcial e garantias durante a montagem.'],references:['oic-parity','oic-strategies','hull'],lab:'strategy'},[
num('Um long box europeu usa K1 = 95 e K2 = 105. Qual seu payoff terminal por unidade?',10,'A soma do bull call com bear put spread paga a largura dos strikes: 105 − 95 = 10.',0.01,1),
choice('Ação + put − call, mesmo strike e vencimento, tem valor terminal:',['S_T, sem proteção.','K, além de proventos recebidos durante a vida.','Zero em todos os estados.'],1,'A put impede valor abaixo de K e a call vendida retira valor acima de K.',['A opcionalidade trava o valor terminal.','Correto, respeitando o calendário dos proventos.','O valor travado é K.']),
num('Pague 9,50 hoje e receba 10 em um ano. Qual o retorno efetivo percentual antes de custos?',5.2632,'(10/9,50 − 1) × 100 = 5,2632%.',0.02,2),
choice('O principal problema em tratar box americano como fluxo determinístico é:',['Seu payoff algébrico no vencimento não pode ser calculado.','Exercício antecipado pode mudar os fluxos e o financiamento.','Toda opção americana vence diariamente.'],1,'A identidade terminal não garante que todas as pernas sobrevivam até lá.',['O payoff pode ser calculado; o caminho de caixa é o problema.','Correto: assignment pode antecipar obrigações.','Estilo americano não altera a data final de vencimento.']),
open('Você encontrou ganho teórico de R$ 0,15 por ação numa reversão. Que cálculo falta antes de defendê-la?',['Bid/ask e execução simultânea.','Empréstimo, dividendos, funding e garantias.','Sensibilidade a quantidade, assignment e liquidação.'],'Construa os fluxos executáveis de vender ação, comprar call e vender put, com preços de cada lado. Desconte proventos devidos, borrow, emolumentos, funding e capital. Teste atraso de uma perna e exercício antecipado. Só então compare a folga líquida com a incerteza operacional.')
]);

add({id:'s1',moduleId:'strategies',title:'Proteção e exposição direcional',minutes:45,level:'Intermediário',prerequisites:['a2'],objectives:['Comparar calls/puts compradas e vendidas.','Montar covered call, protective put e collar.','Escolher uma vertical para uma tese limitada.'],intuition:'Financiar proteção vendendo upside troca uma liberdade por outra. Prêmio zero não significa risco zero nem ausência de custo de oportunidade.',theory:[
'Uma call comprada concentra exposição de alta e limita a perda ao prêmio; uma put comprada faz o equivalente para baixa. Vender put oferece prêmio limitado e assume queda até o ativo valer zero. Vender call sem cobertura assume alta sem limite teórico. Antes de comparar retornos percentuais, normalize o tamanho: a mesma quantidade de contratos não implica o mesmo delta ou a mesma perda de stress.',
'Covered call é ação comprada mais call vendida. O prêmio amortece uma pequena queda, mas não cria piso. Protective put é ação mais put: preserva alta e garante um piso terminal antes dos custos. Collar acrescenta uma call vendida à protective put, cedendo alta para financiar proteção. O custo econômico inclui a alta cedida, mesmo se os prêmios líquidos forem zero. Estilo americano e proventos criam risco de assignment que não aparece no gráfico terminal.',
'Uma bull call spread compra K1 e vende K2 > K1. Com débito D, perda máxima D, lucro máximo K2 − K1 − D e breakeven K1 + D. A bear put spread compra put de strike alto e vende strike baixo. Verticais de crédito expressam teses relacionadas: bull put e bear call. A equivalência de payoffs depende de caixa e taxas. A vertical reduz desembolso e vega em relação à opção isolada, mas também limita a participação no movimento favorável.'
],formula:{expression:'Bull call: max(S_T−K1,0) − max(S_T−K2,0) − D; collar = S_T + put(Kp) − call(Kc)',variables:'K1 < K2; D: débito líquido por ação; Kp < Kc. P&L do collar exige subtrair preço de compra da ação e prêmio líquido.'},example:{title:'Collar sem prêmio líquido',steps:['Ação comprada a 100; put K = 90 custa 3; call K = 110 vendida por 3.','Prêmio líquido zero; custo total inicial = 100.','Se S_T = 70, ação + put vale 90: perda = 10.','Se S_T = 130, call vendida limita valor final a 110: ganho = 10. Entre 90 e 110, resultado = S_T − 100.']},desk:'Pergunte ao cliente qual perda aceita, qual alta aceita ceder e quando pode precisar desmontar. Uma estrutura barata pode falhar no horizonte ou na liquidez que ele realmente precisa.',mistakes:['Tratar covered call como seguro de queda.','Chamar collar de custo econômico zero.','Comparar prêmio recebido com retorno sem incluir o capital e o risco da ação.'],references:['oic-strategies','oic-choose','natenberg'],lab:'strategy'},[
num('Bull call K1 = 100, K2 = 110, débito = 4. Qual o lucro máximo por ação?',6,'Largura 10 menos débito 4 = 6.',0.01,1),
choice('Qual estrutura cria um piso para uma posição comprada em ações?',['Covered call isolada.','Protective put.','Venda descoberta de put.'],1,'A put comprada compensa quedas abaixo de seu strike.',['O prêmio só amortece; não trava a perda.','Correto: ação + put tem piso terminal em K.','Vender put acrescenta risco de queda.']),
num('Ação comprada por 50 e call K = 55 vendida por 2. Se S_T = 30, qual o P&L por ação?',-18,'30 − 50 + 2 = −18; a call expira sem valor.',0.01,2),
choice('Uma bull put spread recebe crédito 2 e tem largura 8. Sua perda máxima nominal é:',['2.','8.','6.'],2,'A obrigação máxima é 8, compensada pelo prêmio recebido de 2.',['Esse é o ganho máximo.','Falta incorporar o crédito.','Correto: 8 − 2 = 6.']),
open('Cliente espera alta moderada até 110, mas não quer perder mais de 4 por ação. Compare ação a 100, call K100 por 7 e bull call 100/110 por 4.',['Comparar perdas e ganhos máximos.','Relacionar limite de alta à tese.','Reconhecer prazo, liquidez e cenário de forte alta.'],'A ação excede o orçamento de perda e a call custa 7. A bull call limita a perda a 4 e captura alta até 110 com ganho máximo 6, alinhando a tese limitada. Ela deixa de participar acima de 110; deve-se verificar que prazo, estilo e liquidez são adequados ao exercício.')
]);

add({id:'s2',moduleId:'strategies',title:'Convexidade: straddles, strangles e asas',minutes:45,level:'Intermediário',prerequisites:['s1'],objectives:['Interpretar estruturas de volatilidade.','Calcular breakevens de straddle e strangle.','Distinguir butterfly, condor e iron condor.'],intuition:'Comprar duas direções não remove o risco. Você passa a precisar de movimento suficiente, ou de uma reprecificação favorável, para pagar a convexidade.',theory:[
'Um straddle comprado reúne call e put no mesmo strike e prazo. Seu payoff é |S_T − K|; com custo D, precisa de um movimento maior que D no terminal. Um strangle compra put de strike menor e call de strike maior: custa menos em situações usuais, mas exige movimento maior para superar os strikes e o prêmio. Antes do vencimento, ambos dependem de volatilidade implícita e tempo; uma alta no spot não garante lucro se a volatilidade cair muito.',
'Uma butterfly de calls igualmente espaçadas compra uma call K1, vende duas K2 e compra uma K3, com K2 no centro. Seu payoff é um pico de largura K2 − K1, máximo em K2. Um condor comprado usa quatro strikes e quantidades +1, −1, −1, +1, formando um platô central. São formas de comprar concentração em uma região terminal; não devem ser descritas apenas como neutras, pois delta e gamma variam com spot e prazo.',
'Um iron condor de crédito vende uma put e uma call internas, protegidas por opções compradas nas asas externas. O crédito é o ganho máximo terminal quando o spot fica entre os strikes vendidos. A perda de cada lado é a largura daquela asa menos o crédito, considerando tamanhos consistentes. As proteções limitam o payoff, mas o resultado de liquidação pode exigir caixa e gestão de exercício. Uma asa muito distante reduz prêmio pago, porém aumenta o risco extremo antes da proteção.'
],formula:{expression:'Straddle P&L = |S_T−K|−D; BE = K±D. Strangle BE = Kput−D e Kcall+D',variables:'D: débito total por unidade; strikes e spot em R$/ação. Fórmulas terminais sem custos e com mesmo vencimento.'},example:{title:'Iron condor com asas simétricas',steps:['Compra put 85, vende put 90, vende call 110, compra call 115; crédito líquido R$ 2.','Entre 90 e 110 todas as opções expiram sem valor: lucro R$ 2.','Abaixo de 85 ou acima de 115, perda = largura 5 − crédito 2 = R$ 3.','Breakevens: 90 − 2 = 88 e 110 + 2 = 112. Entre os strikes das asas, o resultado varia linearmente.']},desk:'Separe tese sobre direção, magnitude realizada e nível implícito. Ao vender volatilidade, mostre o resultado de gap além da asa e a necessidade de margem até a liquidação.',mistakes:['Confundir menor custo do strangle com maior probabilidade de lucro.','Descrever iron condor como renda previsível.','Usar gráfico terminal para explicar o P&L de saída antecipada.'],references:['oic-strategies','natenberg'],lab:'strategy'},[
num('Straddle K = 100 custa 12. Qual o breakeven superior terminal?',112,'K + D = 100 + 12 = 112.',0.01,1),
choice('Um strangle comprado com put 90 e call 110, custo 5, termina em 100. O P&L é:',['Zero.','−5.','+5.'],1,'Ambas expiram OTM; perde-se o débito inicial.',['Zero é o payoff, não o P&L.','Correto: payoff zero menos custo 5.','Prêmio foi pago, não recebido.']),
num('Butterfly de calls 90/100/110, quantidades +1/−2/+1, custa 3. Qual o lucro terminal em S_T = 100?',7,'Payoff = 10 − 0 + 0 = 10; lucro = 10 − 3 = 7.',0.01,2),
choice('Iron condor recebe 1,50, com asa de put de largura 5 e asa de call de largura 10. Maior perda terminal por unidade:',['3,50.','8,50.','1,50.'],1,'O pior lado tem largura 10; desconta-se o crédito 1,50.',['É a perda máxima do lado da put, não da carteira.','Correto: 10 − 1,50 = 8,50.','Crédito é ganho máximo, não perda máxima.']),
open('Antes de resultados, um cliente compra straddle e a ação sobe, mas a operação perde. Explique dois mecanismos.',['Magnitude do movimento versus prêmio.','Queda de IV e passagem do tempo.','Distinguir terminal de marcação.'],'A alta pode não superar o prêmio total, e a put perde valor. Após o anúncio, a incerteza do evento desaparece, reduzindo IV e o valor de ambas as opções. Antes do vencimento, a marcação combina delta, gamma, vega e theta; direção correta não basta.')
]);

add({id:'s3',moduleId:'strategies',title:'Calendars, diagonals, ratios e backspreads',minutes:45,level:'Avançado',prerequisites:['s2','a3'],objectives:['Ler uma carteira com vencimentos distintos.','Identificar riscos ilimitados em ratios.','Separar payoff conhecido de valor residual modelado.'],intuition:'Se uma perna ainda está viva quando outra vence, o gráfico não é um payoff único: parte dele depende do preço de uma opção futura.',theory:[
'Um calendar típico vende a opção curta e compra a longa no mesmo strike. No primeiro vencimento, a curta tem payoff conhecido, mas a longa ainda tem valor temporal e depende da IV remanescente. Um gráfico nessa data exige um modelo e uma hipótese de superfície. Não há um breakeven terminal único de toda a carteira sem definir como serão financiados e liquidados os fluxos intermediários. A diagonal muda também o strike, combinando visão direcional com exposição relativa aos prazos.',
'No call ratio 1×2, compra-se uma call e vendem-se duas em strike superior. A estrutura pode ter crédito ou baixo débito, mas a inclinação na alta extrema é 1 − 2 = −1: a perda é ilimitada. Um call backspread inverte essa proporção, vendendo uma call de strike menor e comprando duas de strike maior. Ele pode capturar uma alta extrema, porém perder em uma região intermediária. O crédito inicial não elimina esse vale de perdas.',
'Para qualquer carteira, some inclinações por faixa de spot, quantidade e multiplicador. Acima de todos os strikes, calls têm inclinação 1, puts 0 e ações 1; abaixo dos strikes, puts compradas têm inclinação −1. Uma inclinação terminal negativa na cauda de alta revela perda ilimitada. Na cauda de baixa, S não fica abaixo de zero para uma ação ordinária: isso limita a perda de puts vendidas, mas pode torná-la muito grande. Greeks e caixa precisam ser agregados por vencimento, porque uma exposição líquida pequena pode esconder dois buckets grandes e opostos.'
],formula:{expression:'Inclinação na alta = Σ(n_i m_i) para ações e calls; calendar(t1) = V_longa(S,t2−t1,σ) − payoff_curta(S)',variables:'n_i assinado: positivo compra, negativo venda; m_i: multiplicador. σ da perna longa é hipótese de marcação, não preço observado futuro.'},example:{title:'O vale de um call backspread',steps:['Venda 1 call K90 por 12; compre 2 calls K100 por 5 cada. Crédito líquido = 2.','Em S_T ≤ 90, lucro = 2. Em S_T = 100, payoff = −10 e P&L = −8.','Acima de 100, P&L = −(S_T−90)+2(S_T−100)+2 = S_T−108.','Breakevens: 92 e 108. Acima de 108 o ganho cresce; o pior ponto é 100, perda 8.']},desk:'Ao comparar calendars, mantenha explícita a curva de IV por vencimento. Para ratios, mostre a inclinação extrema e o número de opções descobertas, não apenas o crédito inicial.',mistakes:['Somar payoffs de datas diferentes como se ocorressem simultaneamente.','Usar uma única IV para explicar risco de calendário em torno de eventos.','Omitir a cauda ilimitada de ratio 1×2.'],references:['oic-strategies','natenberg'],lab:'strategy'},[
choice('No vencimento curto de um calendar, a opção longa deve ser avaliada por:',['Seu payoff terminal, sempre.','Seu valor residual, dependente de prazo e volatilidade.','Zero, porque a outra perna venceu.'],1,'A longa continua viva e contém valor temporal.',['Isso a trataria como vencida antes da data.','Correto: o gráfico é uma marcação modelada.','Vencimentos das pernas são independentes.']),
num('Call ratio compra 1 call K100 e vende 2 calls K110. Qual a inclinação do payoff acima de 110 por unidade?',-1,'Cada call ITM tem inclinação +1 para compra; 1 − 2 = −1.',0.001,2),
choice('Um call backspread comprado 1×2 pode:',['Perder na região intermediária e ganhar na alta extrema.','Garantir lucro em qualquer preço.','Ter sempre perda ilimitada na alta.'],0,'A opção vendida pode dominar antes de as duas compradas ficarem suficientemente ITM.',['Correto: é preciso analisar todos os segmentos.','O crédito não remove o vale de perdas.','Duas calls compradas contra uma vendida dão inclinação positiva na alta.']),
num('Backspread: vende call K90, compra 2 calls K100, recebe crédito 2. Qual o P&L em S_T = 100?',-8,'−max(100−90,0)+2max(100−100,0)+2 = −8.',0.01,2),
open('Por que um calendar não deve exibir “lucro máximo garantido” derivado de um gráfico no primeiro vencimento?',['Valor residual depende de IV/modelo.','Fluxos têm datas distintas.','Exercício e financiamento podem alterar a trajetória.'],'O pico desenhado usa uma hipótese para a opção longa, que ainda não venceu. A IV pode mudar e a curta pode ser exercida. É preciso definir fechamento/rolagem, juros dos fluxos e posição residual. O gráfico é um cenário de marcação, não uma garantia contratual.')
]);

add({id:'p1',moduleId:'pricing',title:'Replicação, árvore binomial e exercício antecipado',minutes:50,level:'Intermediário',prerequisites:['a2'],objectives:['Construir uma carteira replicante de um passo.','Interpretar probabilidade neutra ao risco.','Aplicar indução para trás e decisão americana.'],intuition:'Se ação e caixa reproduzem a opção em todos os estados do modelo, o custo dessa carteira determina o preço da opção.',theory:[
'Em um passo binomial, a ação vai de S para Su ou Sd. Uma carteira de Δ ações e um saldo B em caixa deve satisfazer ΔSu + Be^(rΔt) = Vu e ΔSd + Be^(rΔt) = Vd. Subtraindo, obtemos Δ = (Vu−Vd)/(S(u−d)). Depois resolvemos B e o preço V = ΔS+B. Não precisamos saber a probabilidade real de alta: a replicação fixa o preço por ausência de arbitragem.',
'A mesma conta se escreve V = e^(−rΔt)[pVu+(1−p)Vd], com p = (e^((r−q)Δt)−d)/(u−d). p é um peso de precificação, não a previsão de alta do trader. Ele deve pertencer a [0,1]; fora desse intervalo a discretização não é consistente. Na árvore CRR, u = e^(σ√Δt), d = 1/u. O yield contínuo q entra no carregamento; um dividendo em dinheiro exige tratamento específico e pode prejudicar a recombinação simples.',
'Para vários passos, calcule primeiro os payoffs nas folhas e volte um nível de cada vez. A europeia usa só o valor de continuação. A americana usa o máximo entre intrínseco e continuação em cada nó. O direito adicional implica V_americana ≥ V_europeia nas mesmas hipóteses. A convergência da CRR pode oscilar com paridade do número de passos e posição do strike; aumentar passos não garante erro menor em cada incremento. Compare sequências e valores de referência, com atenção ao custo quadrático.'
],formula:{expression:'p = (e^((r−q)Δt) − d)/(u−d); V_cont = e^(−rΔt)[pVu+(1−p)Vd]; V_am = max(intrínseco,V_cont)',variables:'u e d: fatores de alta/baixa; Δt: anos por passo; r,q: taxas contínuas; Vu,Vd: valores nos nós seguintes em R$/ação.'},example:{title:'Uma call replicada em dois estados',steps:['S = 100, u = 1,20, d = 0,80, K = 100, juros/dividendos zero, um passo.','Payoffs: Vu = 20 e Vd = 0. Δ = (20−0)/(120−80) = 0,5 ação.','No estado de baixa: 0,5 × 80 + B = 0, então B = −40.','Custo = 0,5 × 100 − 40 = 10. Alternativamente p = 0,5 e preço = 0,5 × 20 = 10.']},desk:'Use árvore para comparar estilo europeu e americano e localizar a região de exercício. Faça convergência antes de confiar no último centavo mostrado na tela.',mistakes:['Interpretar p neutro ao risco como previsão objetiva.','Forçar p fora de [0,1] para caber na árvore.','Achar que a árvore CRR simples resolve dividendos discretos automaticamente.'],references:['columbia-binomial','hull'],lab:'calculator'},[
num('Árvore de um passo: S = 50, Su = 60, Sd = 40, call K = 50, juros zero. Qual o delta replicante?',0.5,'Payoffs 10 e 0; Δ = (10−0)/(60−40) = 0,5.',0.001,2),
choice('A probabilidade neutra ao risco é:',['Uma previsão da frequência real de alta.','Um peso que torna o retorno esperado do ativo compatível com o carregamento no modelo.','Sempre 50%.'],1,'A medida de precificação é construída para descontar fluxos replicáveis.',['O prêmio de risco real não é estimado por essa fórmula.','Correto: p vem de u,d,r,q e Δt.','Só em combinações particulares de parâmetros.']),
num('Um nó americano tem intrínseco 8 e continuação 7,30. Qual o valor nesse nó?',8,'O titular escolhe o maior: max(8;7,30) = 8.',0.01,1),
choice('Se p calculado na CRR é 1,08, deve-se:',['Usar 1,08 normalmente.','Revisar discretização/parâmetros, em geral refinando passos.','Trocar automaticamente p por 0,50.'],1,'Um peso fora de [0,1] viola as condições da árvore.',['Isso gera peso negativo no outro ramo.','Correto: não se deve mascarar a inconsistência.','A substituição muda o modelo sem fundamento.']),
open('Explique por que uma americana não pode valer menos que sua europeia equivalente, e por que a diferença pode ser zero.',['Conjunto de decisões contém esperar até T.','Exercício antecipado tem valor apenas se for ótimo.','Dar exemplo de call sem dividendos sob hipóteses usuais.'],'O titular americano pode reproduzir a decisão europeia de esperar. Portanto, não deve pagar menos pelo conjunto maior de direitos. Se nunca for econômico exercer cedo, como uma call sem dividendos sob juros não negativos e hipóteses usuais, o direito extra não acrescenta valor.')
]);

add({id:'p2',moduleId:'pricing',title:'Processos estocásticos, Itô e Black–Scholes–Merton',minutes:60,level:'Avançado',prerequisites:['p1'],objectives:['Relacionar GBM, log-retorno e variância.','Entender a correção de Itô e a eliminação do drift.','Aplicar BSM e reconhecer suas hipóteses.'],intuition:'A curvatura da opção transforma ruído do ativo em um termo previsível de segunda ordem. É isso que conecta gamma, theta e o custo do hedge.',theory:[
'No movimento browniano geométrico, dS = μSdt + σSdW. O incremento dW tem média zero e variância dt; por isso seu tamanho típico é √dt, não dt. A regra (dW)² = dt mantém um termo de segunda ordem que desapareceria no cálculo determinístico. Aplicando Itô a V(S,t), surge dV = (V_t + μSV_S + ½σ²S²V_SS)dt + σSV_SdW. O termo de curvatura é a contribuição econômica do gamma.',
'Venda Δ = V_S ações contra uma opção comprada para cancelar o termo dW instantâneo. Como a carteira localmente sem risco deve render a taxa de financiamento sob as hipóteses do modelo, o drift real μ desaparece. Com yield q, a equação é V_t +(r−q)SV_S +½σ²S²V_SS −rV = 0. A condição terminal é o payoff. A fórmula BSM é a solução para opções europeias vanilla com parâmetros constantes; a precificação usa r−q como drift neutro ao risco.',
'A call vale S e^(−qT)N(d1)−K e^(−rT)N(d2); a put segue a paridade. N(d2) é a probabilidade neutra ao risco de a call expirar ITM no modelo; o delta é e^(−qT)N(d1), uma quantidade diferente. A solução lognormal S_T = S exp((r−q−σ²/2)T + σ√T Z) mostra por que a correção −σ²/2 aparece no log-retorno, embora E[S_T] = Se^((r−q)T).',
'BSM supõe difusão contínua, volatilidade e taxas constantes, negociação contínua, capacidade de financiar e vender a descoberto e ausência de custos. Não modela gaps, smile, liquidez ou exercício americano. Yield contínuo não equivale a um calendário de dividendos discretos. Subtrair o valor presente de dividendos do spot é uma aproximação para certas europeias, não uma solução geral exata. No vencimento, o preço é o payoff e as gregas podem ser descontínuas; a fórmula com √T não deve ser usada cegamente em T = 0.'
],formula:{expression:'d1 = [ln(S/K)+(r−q+σ²/2)T]/(σ√T); d2 = d1−σ√T; c = Se^(−qT)N(d1)−Ke^(−rT)N(d2)',variables:'S,K,c em R$/ação; r,q contínuos anuais; σ volatilidade anual em decimal; T anos; N distribuição normal padrão acumulada.'},example:{title:'Referência BSM clássica',steps:['S = K = 100, T = 1 ano, r = 5%, q = 0, σ = 20%.','d1 = (0 + 0,05 + 0,02)/0,20 = 0,35; d2 = 0,15.','N(d1) ≈ 0,636831; N(d2) ≈ 0,559618.','Call ≈ 10,450584; put ≈ 5,573526. A diferença 4,877058 coincide com 100 − 100e^(−0,05).']},desk:'BSM é também uma linguagem de cotação em IV. Um preço BSM calculado com IV de mercado não valida a dinâmica do modelo nem garante o resultado do hedge.',mistakes:['Usar o retorno esperado da ação no lugar de r na fórmula.','Chamar delta de probabilidade física de exercício.','Tratar IV constante como descrição fiel de toda a superfície.'],references:['mit-ito','hull','natenberg'],lab:'calculator'},[
choice('Qual termo de Itô distingue a expansão estocástica de uma derivada de primeira ordem?',['½σ²S²V_SS dt.','μS apenas.','O prêmio inicial pago.'],0,'A variação quadrática de dW mantém a segunda derivada em ordem dt.',['Correto: curvatura vezes variância local.','Esse termo é drift de primeira ordem.','Prêmio é condição financeira, não termo do lema.']),
num('No caso S = K = 100, r = 5%, q = 0, σ = 20% e T = 1, calcule d1.',0.35,'(ln(1)+(0,05+0,20²/2)×1)/(0,20√1) = 0,35.',0.001,2),
choice('Por que o drift real μ não aparece no preço BSM?',['O mercado sempre espera retorno zero.','A replicação elimina o risco instantâneo e impõe retorno de financiamento.','μ é igual a σ por definição.'],1,'A carteira hedgeada é precificada por não arbitragem sob as hipóteses do modelo.',['Não é uma hipótese necessária.','Correto: a previsão direcional não precifica o fluxo replicável.','São grandezas diferentes.']),
num('No GBM neutro ao risco, r = 6%, q = 2%, σ = 20%. Qual o drift anual do log-preço em percentual?',2,'r − q − σ²/2 = 0,06 − 0,02 − 0,02 = 0,02, ou 2%.',0.01,2),
open('Uma ação tem grande dividendo em dinheiro amanhã. Por que substituir todo o calendário por q constante pode falhar?',['Salto ex-dividendo em data específica.','Exercício antecipado e valor temporal.','Modelo aproximado versus preço contratual.'],'Um yield contínuo espalha a distribuição no tempo e não reproduz o salto ex-dividendo. Isso altera a região de exercício das americanas e a distribuição do spot. Uma árvore/evento discreto ou outro modelo adequado é necessário para analisar a decisão ao redor da data.')
]);

add({id:'p3',moduleId:'pricing',title:'Volatilidade implícita, métodos numéricos e Monte Carlo',minutes:55,level:'Avançado',prerequisites:['p2'],objectives:['Inverter BSM com limites e tolerâncias.','Comparar bisseção e Newton.','Estimar erro amostral de Monte Carlo.'],intuition:'Uma volatilidade implícita é a resposta a uma pergunta de modelo: qual σ reproduz este preço? Monte Carlo responde outra: qual a média descontada dos fluxos simulados?',theory:[
'Para uma vanilla europeia com S,K,T positivos, o preço BSM cresce com σ. A IV resolve f(σ)=V_BSM(σ)−V_observado=0. Antes de procurar a raiz, teste os limites de não arbitragem e os dados do contrato. Bisseção mantém um intervalo que contém a raiz e o divide; é robusta, mas requer um limite superior capaz de cercar o preço. Newton usa σ_novo=σ−f/vega, converge rapidamente perto da solução, porém pode saltar para valores inválidos se o vega for pequeno. Uma abordagem híbrida preserva o intervalo.',
'A tolerância de preço deve ser coerente com tick, precisão dos inputs e bid/ask. Próximo do vencimento ou muito longe do dinheiro, o vega pode ser minúsculo: um centavo de erro vira enorme mudança em IV. Preços no limite inferior podem corresponder a σ = 0; no limite superior, a IV finita pode não existir. Uma IV numericamente calculada não é automaticamente informativa, nem comparável entre modelos com estilos/dividendos diferentes.',
'Monte Carlo simula caminhos sob a medida escolhida e estima V ≈ e^(−rT) média(payoff). Para preço replicável, usa-se a medida neutra ao risco, não o drift de uma previsão de investimento. O erro padrão da média descontada é desvio amostral dos fluxos descontados dividido por √N. Aproximadamente quadruplicar caminhos reduz o erro pela metade. Uma semente fixa permite reproduzir o experimento, mas não diminui o erro. Variáveis antitéticas e controles podem reduzir variância, com hipóteses e diagnósticos.',
'Há dois erros distintos: amostragem e discretização temporal. Para uma vanilla europeia no GBM, o terminal pode ser simulado exatamente. Para barreiras, olhar apenas pontos de uma malha pode perder toques entre observações. Aumentar caminhos não corrige esse viés. Monte Carlo direto também não resolve automaticamente exercício americano, que exige uma decisão ótima condicionada ao estado. Um intervalo estatístico estreito pode conviver com grande erro de modelo.'
],formula:{expression:'V̂ = (1/N)Σe^(−rT) payoff_j; SE = s_descontado/√N; IC aproximado 95% = V̂ ± 1,96 SE',variables:'N: caminhos independentes; s_descontado: desvio amostral dos payoffs descontados; SE e V̂ em R$/ação. IC normal assintótico.'},example:{title:'Precisão não vem de mais casas decimais',steps:['10.000 caminhos dão preço médio 8,20 e desvio dos payoffs descontados 15.','SE = 15/√10.000 = 0,15. IC aproximado: 8,20 ± 0,294.','Para SE de 0,075, mantendo variância semelhante, são necessários cerca de 40.000 caminhos.','Exibir 8,200000 não acrescenta informação; reportar incerteza amostral e possíveis vieses é mais útil.']},desk:'Ao explicar diferença entre modelos, separe erro numérico, inputs e hipóteses. Ao cotar IV, acompanhe bid/ask e vega para não dar falsa precisão.',mistakes:['Rodar IV para preço fora dos limites.','Usar Newton sem proteção quando vega é quase zero.','Confundir erro padrão pequeno com modelo correto.'],references:['columbia-mc','mit-finance','hull'],lab:'calculator'},[
num('Desvio amostral dos payoffs descontados = 12; N = 3.600. Qual o erro padrão?',0.2,'SE = 12/√3.600 = 12/60 = 0,20.',0.001,2),
choice('Para reduzir pela metade o erro padrão de Monte Carlo, aproximadamente:',['Dobre N.','Quadruplicate N.','Troque apenas a semente.'],1,'SE varia com 1/√N, mantendo variância semelhante.',['Dobra reduz por √2, não por 2.','Correto: √4 = 2.','Semente altera a amostra, não a ordem do erro.']),
choice('Qual situação torna IV numericamente instável?',['Vega muito pequeno.','Preço no meio de um bid/ask estreito e alto vega.','Prazo e contrato bem definidos.'],0,'dσ/dV = 1/vega: pouco vega amplifica erros de preço.',['Correto: pequenos centavos podem mudar muito a IV.','Isso tende a melhorar a identificação.','Definições corretas ajudam, não criam instabilidade.']),
num('Preço estimado 5,00 e SE = 0,10. Qual o limite superior do IC normal aproximado de 95%?',5.196,'5 + 1,96 × 0,10 = 5,196.',0.005,2),
open('Seu Monte Carlo de barreira converge com muitos caminhos, mas diverge de um benchmark contínuo. Explique.',['Distinguir monitoramento discreto e contínuo.','Separar viés temporal de erro amostral.','Propor refinamento ou ponte browniana.'],'Se o simulador só testa a barreira nos pontos da malha, ignora possíveis toques entre eles. Mais caminhos estabilizam esse preço discreto, sem transformá-lo no contínuo. Compare contratos de mesmo monitoramento e refine a malha ou use correção apropriada, como ponte browniana sob hipóteses compatíveis.')
]);

add({id:'g1',moduleId:'greeks',title:'Delta, gamma, theta, vega e rho: unidades primeiro',minutes:45,level:'Intermediário',prerequisites:['p2'],objectives:['Interpretar derivadas como sensibilidades locais.','Converter vega/rho em pontos percentuais.','Usar theta por dia com convenção explícita.'],intuition:'Uma grega sem unidade é como uma distância sem escala. Antes de somar números, pergunte qual choque cada número representa.',theory:[
'Delta é ∂V/∂S: reais de valor da opção por um real de variação do ativo, por unidade. Para call BSM é e^(−qT)N(d1); para put, e^(−qT)(N(d1)−1). Gamma é ∂²V/∂S² e mede quanto delta varia por unidade de spot. Long calls e long puts vanilla têm gamma positivo: ganham convexidade em movimentos de ambos os sinais, mas pagam por ela em prêmio e geralmente theta.',
'Vega matemático é ∂V/∂σ para σ em decimal. O vega de mesa por um ponto percentual de volatilidade é esse valor dividido por 100. Se vega de mesa vale 0,30, passar de 20% para 22% sugere +0,60, não +60. Rho costuma seguir a mesma conversão por 1 ponto percentual de juros. Para choques em basis points, 100 bp = 1 ponto percentual. Quantidade e multiplicador devem ser aplicados depois de identificar a unidade do número.',
'Theta é a derivada em relação ao tempo de calendário que passa, mantendo outros inputs fixos. Se T representa prazo restante, theta = −∂V/∂T. Um theta anual dividido por 365 é uma aproximação por dia corrido; dividir por 252 significa outra convenção. Long vanilla costuma ter theta negativo, mas não é uma lei universal para qualquer estilo, moneyness, juros e dividendos. Próximo do vencimento e do strike, as sensibilidades mudam rapidamente e uma derivada local pode não representar nem um dia inteiro.'
],formula:{expression:'Δ = ∂V/∂S; Γ = ∂²V/∂S²; Vega_1pp = (∂V/∂σ)/100; Θ_dia = (∂V/∂t)/365; Rho_1pp = (∂V/∂r)/100',variables:'V por unidade em R$; S em R$/ação; σ,r em decimal; t em anos. Dia corrido de 365 é a convenção deste laboratório.'},example:{title:'Dimensionar um choque de volatilidade',steps:['Vega matemático = 30 por unidade; 10 contratos de 100 unidades; posição comprada.','Vega por 1 pp = 30/100 = R$ 0,30 por unidade.','Choque de 20% para 23% = +3 pp = +0,03 em decimal.','P&L aproximado = 0,30 × 3 × 10 × 100 = R$ 900. Usar 30 × 3 erraria por fator 100.']},desk:'Escreva o cabeçalho de risco com unidades: delta em ações, gamma por R$ de spot, vega em R$/pp, theta em R$/dia e rho em R$/pp. Isso evita erros entre sistemas.',mistakes:['Confundir 1% relativo com 1 ponto percentual.','Somar gregas unitárias a gregas de contrato.','Apresentar theta sem dizer dia útil ou corrido.'],references:['oic-greeks','natenberg','hull'],lab:'greeks'},[
num('Vega matemático = 40. Qual o vega por 1 ponto percentual de IV?',0.4,'40/100 = 0,40 por 1 pp.',0.001,1),
choice('Gamma positivo significa que:',['Delta aumenta quando o spot aumenta, localmente.','A opção ganha sempre.','Theta é sempre positivo.'],0,'Gamma é a derivada de delta em relação ao spot.',['Correto: é a definição local.','Prêmio, theta e outros fatores podem gerar perda.','Convexidade não implica theta positivo.']),
num('Theta anual = −36,50 por unidade. Qual o theta diário aproximado em base 365?',-0.1,'−36,50/365 = −0,10 por dia corrido.',0.001,1),
choice('IV sobe de 20% para 21%. Isso é:',['Aumento de 1% relativo e 1 pp.','Aumento de 5% relativo e 1 pp.','Aumento de 100 pp.'],1,'(21−20)/20 = 5% relativo; diferença absoluta = 1 pp.',['O aumento relativo usa 20 como base.','Correto: duas maneiras distintas de medir o choque.','Um ponto percentual não são cem pontos percentuais.']),
open('Por que “delta 500” é uma comunicação incompleta?',['Unidade e ativo.','Contrato/multiplicador e agregado.','Spot de referência e convenção de delta.'],'Pode significar 500 ações equivalentes, 500 contratos ou um delta monetário. É preciso declarar ativo, unidade, spot, modelo e agregação. Um delta monetário costuma envolver multiplicar por spot, e não pode ser hedgeado como se fosse quantidade de ações.')
]);

add({id:'g2',moduleId:'greeks',title:'Carteiras, vanna, volga e charm',minutes:50,level:'Avançado',prerequisites:['g1','s3'],objectives:['Agregar gregas por posição e vencimento.','Interpretar sensibilidades cruzadas.','Entender por que hedge estático envelhece.'],intuition:'Neutralizar delta é fotografar o risco. Gamma, vanna e charm explicam como a fotografia deixa de representar a carteira quando o mercado e o relógio se movem.',theory:[
'Gregas de carteira são somas assinadas das gregas das pernas, multiplicadas por quantidade e unidade econômica. A ação tem delta 1 e gamma/vega zero no modelo; caixa tem exposição a juros conforme sua representação. Delta líquido pequeno pode resultar de posições enormes e opostas. Separe buckets por ativo, vencimento, strike e moeda para revelar riscos de base, liquidez e superfície que uma soma escalar esconde.',
'Vanna é ∂²V/(∂S∂σ): mede como delta muda com IV, ou como vega muda com spot. Volga, também chamada vomma, é ∂²V/∂σ² e mede curvatura na volatilidade. Charm exige declarar o sinal temporal: aqui ∂Δ/∂t, com tempo de calendário avançando. Alguns sistemas usam ∂Δ/∂T com prazo restante, cujo sinal é oposto. Vanna e volga matemáticas usam σ em decimal; se converter para pp, a primeira recebe fator 1/100 e a segunda 1/10.000.',
'Uma carteira delta-neutra e vega-neutra pode perder em um choque combinado: o termo vanna ΔSΔσ e a curvatura volga continuam vivos. Também pode carregar gamma grande ou hedge em ativos correlacionados que se descorrelacionam. Sensibilidades de ordem alta ficam instáveis perto do vencimento e nas descontinuidades. Estimativas por diferenças finitas exigem passo suficientemente pequeno para ser local, mas não tão pequeno que erro numérico domine. Compare convenções antes de comparar sinais entre sistemas.'
],formula:{expression:'G_carteira = Σ n_i m_i G_i; Vanna = ∂Δ/∂σ; Volga = ∂Vega/∂σ; Charm = ∂Δ/∂t',variables:'n_i com sinal; m_i: unidades/contrato. Derivadas de σ em decimal e t em anos, salvo conversão explicitamente indicada.'},example:{title:'Uma neutralidade que depende da volatilidade',steps:['Carteira tem delta zero e vanna matemática agregada de 200 ações por unidade decimal de σ.','A IV sobe de 20% para 25%: Δσ = 0,05.','A variação de delta devida apenas à vanna é aproximadamente 200 × 0,05 = +10 ações.','Mesmo com spot parado, o hedge agora precisaria vender cerca de 10 ações para restaurar delta zero; charm e outros efeitos também podem contribuir.']},desk:'Além do risco total, acompanhe risco por bucket. Uma vega longa em um vencimento e curta em outro não é uma proteção perfeita contra um evento localizado.',mistakes:['Tratar vega líquido zero como proteção de toda a superfície.','Comparar charm de sinais opostos sem checar t versus T.','Aplicar conversão de 1/100 à volga por pp², quando é 1/10.000.'],references:['natenberg','hull','oic-greeks'],lab:'greeks'},[
num('Long 2 contratos de 100 unidades, delta 0,60; short 1 contrato de 100 unidades, delta 0,40. Qual delta agregado?',80,'2×100×0,60 − 1×100×0,40 = 80 ações.',0.01,2),
choice('Vanna mede, entre outras interpretações:',['Mudança do delta quando a volatilidade muda.','Somente passagem do tempo.','Preço de exercício da opção.'],0,'É a derivada cruzada em spot e volatilidade.',['Correto: ∂Δ/∂σ.','Esse efeito sobre delta é charm.','Strike é parâmetro contratual.']),
num('Vanna agregada matemática = −300. Choque de IV = +2 pp. Qual a mudança aproximada de delta devida à vanna?',-6,'−300 × 0,02 = −6 ações.',0.01,2),
choice('Um sistema define charm por tempo decorrido, outro por prazo restante. Mantidas as demais condições:',['Os valores têm sempre o mesmo sinal.','Os sinais são opostos.','Não existe relação.'],1,'T restante diminui quando t aumenta; as derivadas diferem por sinal.',['As variáveis temporais se movem em sentidos opostos.','Correto: ∂Δ/∂t = −∂Δ/∂T.','A regra da cadeia relaciona as duas definições.']),
open('Uma carteira tem vega líquido zero: +100 no prazo curto e −100 no longo. Dê um cenário de perda.',['Choque não paralelo da curva.','Unidades e direção dos buckets.','Evitar promessa de hedge perfeito.'],'Se a IV curta cair 3 pp e a longa subir 1 pp, com vegas em R$/pp, a aproximação é 100×(−3)+(−100)×1 = −400. O zero líquido só neutraliza um pequeno choque paralelo nas hipóteses locais.')
]);

add({id:'g3',moduleId:'greeks',title:'Atribuição de P&L e matriz de stress',minutes:50,level:'Avançado',prerequisites:['g2'],objectives:['Construir aproximação delta–gamma–vega–theta.','Comparar com reprecificação completa.','Explicar residual e cenários de liquidez.'],intuition:'Gregas explicam pequenas mudanças ao redor de um ponto. Stress pergunta o que acontece longe desse ponto, onde a linearização pode falhar.',theory:[
'Uma expansão de Taylor aproxima a variação do valor por ΔΔS + ½Γ(ΔS)² + VegaΔσ + ThetaΔt + RhoΔr. Para choques combinados, acrescente VannaΔSΔσ e ½Volga(Δσ)² se essas derivadas estiverem disponíveis e em unidades compatíveis. Theta multiplica tempo que passou; se estiver por dia, use número de dias, não fração de ano. Não acrescente o P&L da ação hedge duas vezes.',
'Reprecificação completa recalcula todas as pernas nos novos spot, IV, taxa e prazo. Ela captura não linearidades do modelo escolhido, mas não elimina erro de modelo. Uma matriz spot × IV ajuda a revelar convexidade e exposição de cauda; repetir a matriz para diferentes datas mostra a concentração do risco perto do vencimento. Uma superfície real pode mudar de forma; um choque paralelo em IV é apenas um cenário, não a dinâmica universal do mercado.',
'O residual é P&L observado ou reprecificado menos os componentes explicados. Pode vir de termos de ordem alta, smile, dividendos, funding, bid/ask, passagem de eventos e mudanças de posição. Investigue antes de atribuí-lo a erro do trader. Risco de mercado e risco de caixa não são iguais: uma carteira com perda terminal limitada pode exigir recursos significativos durante uma chamada de margem, assignment ou desmontagem em mercado ilíquido. Inclua gaps e custos adversos como cenários separados.'
],formula:{expression:'ΔV ≈ Δ·ΔS + ½Γ(ΔS)² + Vega·Δσ + Θ·Δt + Rho·Δr; residual = ΔV_full − ΔV_aprox',variables:'Vega e rho matemáticos requerem choques decimais. Theta anual requer Δt em anos. Todos os componentes devem terminar na mesma moeda.'},example:{title:'Explicação local de um movimento conjunto',steps:['Por unidade: delta 0,50; gamma 0,04; vega por pp 0,20; theta por dia −0,03.','Cenário: spot +2, IV +3 pp, um dia transcorrido.','Delta: 1,00; gamma: ½×0,04×4 = 0,08; vega: 0,60; theta: −0,03.','Total aproximado = 1,65. Se a reprecificação der 1,72, residual = 0,07, que pode refletir termos cruzados e mudança das gregas.']},desk:'Ao reportar P&L, reconcilie posição inicial, trades intradia, carregamento e marcação. Uma boa explicação diferencia componentes do modelo e custos efetivamente realizados.',mistakes:['Usar Taylor para um gap extremo como se fosse exato.','Chamar reprecificação BSM de preço real garantido.','Somar vega por pp com choque decimal sem converter.'],references:['natenberg','hull'],lab:'stress'},[
num('Delta = 0,50, gamma = 0,10 e ΔS = 2. Sem outros choques, qual ΔV de segunda ordem?',1.2,'0,50×2 + ½×0,10×2² = 1 + 0,20 = 1,20.',0.01,2),
choice('Quando a aproximação por gregas tende a ser menos confiável?',['Choques pequenos em região suave.','Gap grande próximo ao vencimento e ao strike.','Posição linear em ação.'],1,'Curvaturas mudam rapidamente e termos de ordem alta passam a importar.',['É a situação em que a aproximação local costuma funcionar melhor.','Correto: cenário distante da expansão.','Para ação sem eventos, o componente de preço é linear.']),
num('P&L reprecificado = −120; P&L aproximado = −100. Qual o residual full menos aproximação?',-20,'−120 − (−100) = −20.',0.01,1),
choice('Reprecificação completa significa:',['Ausência de risco de modelo.','Recalcular os preços nos novos inputs do modelo.','Conhecer a execução futura ao bid/ask.'],1,'Ela é completa dentro do modelo e dos cenários informados.',['Hipóteses erradas continuam produzindo preços errados.','Correto: supera a aproximação local, não toda incerteza.','Liquidez e execução exigem hipóteses próprias.']),
open('Uma vertical tem perda terminal limitada. Por que incluir cenário de liquidez no stress?',['Desmontagem e bid/ask.','Assignment de uma perna e posição residual.','Margem e financiamento intermediários.'],'O limite terminal supõe que as pernas sejam mantidas e liquidadas conforme o contrato. Antes disso, spreads podem alargar, uma americana pode ser exercida e garantias podem aumentar. A necessidade de caixa para atravessar o caminho pode exceder o débito inicial.')
]);

add({id:'v1',moduleId:'volatility',title:'Histórica, realizada e implícita: três perguntas',minutes:45,level:'Intermediário',prerequisites:['p3'],objectives:['Calcular volatilidade de log-retornos.','Anualizar variância de forma consistente.','Comparar IV com realizada sem confundir medidas.'],intuition:'Histórica resume uma amostra passada; realizada mede um caminho observado; implícita é um parâmetro que reconcilia um preço de opção com um modelo.',theory:[
'Calcule log-retornos x_t = ln(S_t/S_(t−1)), ajustando corretamente eventos corporativos conforme a finalidade. A volatilidade histórica usual é o desvio amostral desses retornos em uma janela. Multiplicar por √252 anualiza retornos diários de pregões sob a hipótese de incrementos com variância aditiva e dependência desprezível. A escolha da janela muda a estimativa: janela curta reage rápido, mas é ruidosa; longa suaviza, mas pode misturar regimes.',
'Volatilidade realizada pode designar uma medida ex post baseada em retornos diários ou intradiários. Em alta frequência, microestrutura e preços stale contaminam a soma dos quadrados; em baixa frequência, o caminho entre fechamentos é perdido. Um retorno overnight incorpora risco diferente de uma sequência intradiária. Declare frequência, tratamento de média, dias e anualização. Desvio-padrão não resume assimetria, caudas ou risco de salto.',
'IV resulta de inverter um preço de opção. Ela depende de strike, prazo, modelo, bid/ask e oferta/demanda, incorporando risco e prêmio de seguro. Não é uma previsão imparcial da realizada futura. Comparar IV de 30 dias com realizada dos últimos 30 dias mistura um preço prospectivo com uma janela passada; para avaliar uma previsão, compare horizontes futuros realizados após a observação, sem informação antecipada. Para trades delta-hedged, a variância realizada ponderada pelo gamma pode ser mais relevante que uma estatística única do período.'
],formula:{expression:'x_t = ln(S_t/S_(t−1)); s² = Σ(x_t−x̄)²/(n−1); σ_anual = s√252; variância total = σ²T',variables:'x e s em decimais por pregão; n: observações; σ anual em decimal; T em anos compatíveis. Base 252 é uma convenção declarada, não universal.'},example:{title:'Escalar volatilidade e variância',steps:['Desvio diário de log-retornos: 1,25% = 0,0125.','Vol anual estimada = 0,0125√252 ≈ 19,8431%.','Se σ anual = 20% e horizonte = 0,25 ano, desvio do log-retorno aproximado = 20%√0,25 = 10%.','A variância total é 0,20²×0,25 = 0,01. Não multiplique volatilidade linearmente pelo prazo.']},desk:'Ao comparar uma IV com histórico, escreva janela, frequência, ajuste de proventos e horizonte. O número isolado “vol 25” não basta para decidir se uma opção está cara.',mistakes:['Anualizar volatilidade por 252 em vez de √252.','Tratar IV como probabilidade de ganho.','Usar dados futuros ao testar uma regra de negociação.'],references:['oic-technical','natenberg','hull'],lab:'greeks'},[
num('Desvio diário = 1%. Qual a volatilidade anual em percentual usando 252 pregões?',15.8745,'1% × √252 ≈ 15,8745%.',0.02,2),
choice('IV é melhor descrita como:',['Desvio-padrão observado ontem.','Parâmetro que reproduz um preço de opção em um modelo.','Garantia da volatilidade futura.'],1,'Ela é inferida do preço e depende das hipóteses de precificação.',['Isso é uma estatística de retornos, não IV.','Correto: a interpretação é condicional ao modelo.','Preços incorporam prêmio de risco e podem errar o futuro.']),
num('Vol anual = 30%, T = 0,25. Qual o desvio aproximado do log-retorno no horizonte, em percentual?',15,'30% × √0,25 = 15%.',0.01,1),
choice('Qual comparação evita viés de olhar o futuro ao estudar uma regra baseada em IV?',['Usar somente inputs conhecidos na data da decisão.','Escolher a janela depois de ver o resultado.','Excluir todas as operações que deram perda.'],0,'Uma simulação precisa respeitar o conjunto de informação de cada data.',['Correto: dados posteriores servem para avaliar, não para escolher o passado.','Isso pode otimizar a regra retrospectivamente.','Isso produz seleção enviesada.']),
open('Duas séries têm a mesma volatilidade anual, mas uma contém um grande gap. Por que o risco de hedge pode diferir?',['Distribuição temporal da variância.','Hedge discreto e impossibilidade de operar durante salto.','Cauda e gamma dependente do spot.'],'A mesma soma de quadrados pode vir de muitos movimentos pequenos ou de um salto. O hedge pode ser ajustado entre movimentos pequenos, mas não dentro do gap. Além disso, gamma e liquidez mudam ao longo do caminho; uma única vol não resume essas diferenças.')
]);

add({id:'v2',moduleId:'volatility',title:'Smile, skew, curva a termo e eventos',minutes:50,level:'Avançado',prerequisites:['v1','g2'],objectives:['Ler IV por strike e vencimento.','Decompor variância de evento.','Distinguir sticky strike e sticky delta.'],intuition:'A superfície descreve quais estados e datas estão caros. Um único número de volatilidade apaga justamente a informação que muitas estruturas negociam.',theory:[
'Smile é a variação de IV com strike para um prazo; skew descreve a inclinação dessa relação. Em ações, puts de strikes baixos podem carregar IV maior, refletindo preços relativos de proteção de queda e distribuições assimétricas. Isso não implica por si só arbitragem: é o mapa de preços do mercado traduzido por BSM. Use forward moneyness ou delta com convenção explícita para comparar prazos e ativos; strikes nominais iguais podem representar exposições diferentes.',
'A estrutura a termo mostra IV por vencimento. Um evento discreto, como resultado corporativo, pode elevar muito a IV anualizada do prazo curto, porque sua variância fica dividida por pouco tempo. Uma decomposição simples é w(T)=σ_base²T+v_evento para prazos que contêm o evento. Depois da divulgação, v_evento sai do risco futuro e pode ocorrer vol crush. Comparar somente vols anualizadas pode esconder que a variância total ainda cresce com o prazo.',
'Sticky strike mantém a IV de cada strike fixa enquanto spot muda; sticky delta mantém a forma em coordenadas de delta ou moneyness, deslocando os strikes associados. São regras de cenário, não leis do mercado. Sob skew, o delta total de uma opção marcada por superfície pode incluir Vega×dσ/dS além do delta BSM com IV congelada. Uma estrutura delta-neutra sob uma regra pode não ser neutra sob outra. Na mesa, descreva explicitamente como o cenário move a superfície.'
],formula:{expression:'w(T) = σ_impl(T)²T; w(T) ≈ σ_base²T + v_evento; Δ_total ≈ Δ_BSM + Vega·(dσ/dS)',variables:'w e v_evento: variância em unidades decimais ao quadrado; T em anos; Vega matemático por unidade decimal de σ.'},example:{title:'A mesma variância de evento em dois prazos',steps:['Vol base 20%; variância do evento = 0,0025 (desvio de evento de 5%).','Para T = 0,25: w = 0,04×0,25+0,0025 = 0,0125; IV = √(0,0125/0,25) ≈ 22,3607%.','Para T = 1: w = 0,04+0,0025 = 0,0425; IV ≈ 20,6155%.','O prazo curto tem maior IV anualizada; o longo tem maior variância total. Após o evento, a parcela extra desaparece nessa simplificação.']},desk:'Calendars em torno de resultados são trades de distribuição temporal de variância. A perna curta e a longa podem reagir de maneira muito diferente ao mesmo anúncio.',mistakes:['Confundir skew com uma opção automaticamente mal precificada.','Comparar IVs de prazos distintos sem olhar σ²T.','Atribuir um único delta à carteira sem regra de movimento da superfície.'],references:['cboe-decomposition','oic-technical','natenberg'],lab:'stress'},[
num('IV = 20%, T = 0,5 ano. Qual a variância total σ²T?',0.02,'0,20² × 0,5 = 0,02.',0.0001,1),
choice('Após resultados, a IV pode cair mesmo com grande movimento da ação porque:',['A incerteza do evento já foi resolvida.','Opções deixam de ter strike.','O prêmio pago pelo cliente é devolvido.'],0,'A parcela de variância futura associada ao anúncio deixa de existir.',['Correto: é a lógica do vol crush.','Strike continua sendo condição contratual.','Prêmios não são devolvidos por resolução do evento.']),
choice('Em sticky strike, quando o spot muda:',['A IV associada a um strike fixo é mantida no cenário.','Todas as opções mantêm o mesmo delta.','A IV é recalculada para garantir lucro do hedge.'],0,'O mapa de IV por strike fica congelado segundo essa hipótese.',['Correto: é uma convenção de cenário.','Delta muda com spot e prazo.','Não existe tal garantia.']),
num('Vol base 20%, T = 0,25 e variância de evento 0,0025. Qual a IV anualizada em percentual?',22.3607,'√((0,20²×0,25+0,0025)/0,25) × 100 ≈ 22,3607%.',0.02,2),
open('Um trader diz que 30% em um mês é mais variância do que 25% em um ano. Avalie.',['Calcular σ²T.','Distinguir taxa anualizada e variância total.','Mencionar evento e comparabilidade do horizonte.'],'Em um mês aproximado por 1/12 ano, 0,30²/12 = 0,0075. Em um ano, 0,25² = 0,0625. O curto tem vol anualizada maior, mas variância total muito menor. Eventos podem explicar a inclinação; as exposições não são intercambiáveis.')
]);

add({id:'v3',moduleId:'volatility',title:'Superfície sem arbitragem e modelos além de BSM',minutes:55,level:'Avançado',prerequisites:['v2','p3'],objectives:['Testar monotonicidade e convexidade em strike.','Entender volatilidade local e estocástica.','Interpretar prêmio de risco de volatilidade.'],intuition:'Ajustar uma curva bonita a IVs não basta. Ela precisa representar preços compatíveis entre si e não promete descrever corretamente o caminho futuro.',theory:[
'Para calls europeias de mesmo vencimento, o preço deve cair quando o strike aumenta e deve ser convexo em strike. Uma butterfly com strikes igualmente espaçados tem payoff não negativo; portanto C(K−h)−2C(K)+C(K+h) não pode ser negativo em um mercado ideal sem custos. A inclinação também tem limites relacionados ao desconto, porque uma vertical não pode pagar mais que sua largura. Testar essas restrições em preços é mais direto que inspecionar visualmente uma curva de IV.',
'Restrições entre vencimentos exigem cuidado com dividendos, taxas e coordenadas. Sob hipóteses usuais, ausência de arbitragem de calendário pode ser expressa usando preços normalizados e variância total em log-moneyness forward. Não se deve impor mecanicamente que toda call de strike fixo fique mais cara com prazo quando dividendos, juros negativos ou eventos de caixa alteram o carregamento. Interpolação e extrapolação precisam preservar condições, sobretudo nas asas onde há pouca informação.',
'Volatilidade local define σ_loc(S,t), uma função determinística do estado, calibrável à superfície europeia sob condições regulares. Modelos estocásticos introduzem um fator aleatório de variância, frequentemente correlacionado com o ativo. Dois modelos podem reproduzir hoje preços vanilla e discordar muito sobre barreiras, forward smiles e hedge futuro. Calibrar bem a fotografia não prova dinâmica correta. Parâmetros também precisam ser estáveis e identificáveis.',
'O prêmio de risco de volatilidade/variância é a diferença entre preços de risco implícitos e expectativas sob a medida real, com definição e horizonte claros. Vender proteção pode capturar remuneração média, mas essa remuneração compensa exposição a crises, gaps, correlação e liquidez. IV maior que uma estimativa histórica não prova arbitragem nem assegura ganho. É preciso considerar seleção da amostra, custos, funding e perdas de cauda que ocorrem raramente.'
],formula:{expression:'C(K−h) − 2C(K) + C(K+h) ≥ 0; 0 ≤ C(K1)−C(K2) ≤ (K2−K1)e^(−rT)',variables:'Calls europeias, mesmo ativo e T; K1<K2; h>0; preços por unidade. Restrições ideais antes de fricções.'},example:{title:'Uma butterfly revela uma superfície impossível',steps:['Calls com strikes 90, 100 e 110 custam 14, 10 e 5, mesmo prazo e unidades.','Butterfly comprada custa 14 − 2×10 + 5 = −1: recebe R$ 1.','Seu payoff terminal é não negativo e máximo no strike 100.','Isso viola convexidade ideal. Antes de executar, cheque bid/ask, timestamps, estilo e disponibilidade das três pernas.']},desk:'Valide superfícies em preços e em cenários. Marcas interpoladas podem criar arbitragem artificial ou gregas explosivas mesmo quando os pontos líquidos parecem razoáveis.',mistakes:['Supor que qualquer interpolação suave de IV é livre de arbitragem.','Confundir calibração estática com previsão de dinâmica.','Apresentar venda de vol como lucro recorrente sem caudas.'],references:['mit-finance','cboe-vrp','hull'],lab:'stress'},[
num('Calls K90/K100/K110 custam 14/10/5. Qual o custo da butterfly +1/−2/+1?',-1,'14 − 20 + 5 = −1; preço negativo para payoff não negativo viola convexidade ideal.',0.01,2),
choice('Uma superfície de calls sem arbitragem em strike deve apresentar:',['Preço crescente e côncavo.','Preço decrescente e convexo.','Preço igual para todos os strikes.'],1,'Strikes mais altos reduzem o direito; convexidade decorre de butterflies não negativas.',['Ambas as propriedades estão invertidas.','Correto sob mesmas condições contratuais.','Isso não descreve uma superfície geral.']),
choice('Dois modelos calibrados às mesmas vanillas podem divergir em barreiras porque:',['Payoffs de barreira dependem da dinâmica do caminho.','Calibração torna todos os produtos idênticos.','Barreiras não têm fluxo financeiro.'],0,'A distribuição terminal não determina toda a distribuição dos caminhos.',['Correto: dinâmica e monitoramento importam.','Vanillas não identificam toda a dinâmica.','Há fluxos condicionais a eventos de trajetória.']),
num('Juros zero, strikes 100 e 110. Qual o maior preço admissível de uma bull call spread europeia por unidade?',10,'O payoff nunca excede a largura 10; com juros zero o preço não pode exceder 10.',0.01,1),
open('Explique por que IV acima da realizada histórica não constitui arbitragem.',['Futuro pode diferir do passado.','Prêmio por cauda e medida real/neutra ao risco.','Custos e hedge discreto.'],'Histórico não é garantia de variância futura. O preço da proteção inclui aversão a crises e risco de gaps, e sua comparação com realizada exige horizontes compatíveis. Custos de hedge, financiamento e perdas raras podem consumir o prêmio aparente; não há fluxo positivo travado em todos os estados.')
]);

add({id:'h1',moduleId:'hedging',title:'Delta hedge e a conta de caixa autofinanciada',minutes:50,level:'Avançado',prerequisites:['g3'],objectives:['Montar hedge de uma opção vendida.','Contabilizar prêmio, ações, juros e custos.','Comparar posição hedgeada e descoberta.'],intuition:'Hedge não é apenas comprar ou vender ações. Toda troca altera um saldo de caixa que rende ou custa dinheiro até o próximo ajuste.',theory:[
'Uma call vendida tem delta negativo. Para neutralizar localmente, compre Δ da call por unidade vendida, com quantidade e multiplicador. O prêmio recebido financia parte da compra; a diferença fica em caixa negativo e acumula custo de juros. Se você começar a simulação ignorando esse empréstimo, pode fabricar um ganho que não existe. Um hedge autofinanciado usa somente o caixa inicial e os fluxos da própria carteira, salvo aportes explicitamente registrados.',
'No rebalanceamento, atualize primeiro juros e dividendos do intervalo; depois calcule o novo delta e negocie a diferença de ações. Se H_n é o estoque de hedge, o caixa muda por −(H_n−H_(n−1))S_n, menos custos e slippage. No vencimento, liquide o estoque, pague o payoff da opção vendida e inclua o custo de fechamento. O resultado final é a soma de todos os fluxos, não apenas a diferença entre preço de venda e recompra da opção.',
'Compare hedgeado e sem hedge no mesmo caminho, com mesmo prêmio, funding e convenções. A posição descoberta mantém o prêmio em caixa até pagar o payoff; a hedgeada troca risco direcional por custo e erro de rebalanceamento. Hedge discreto não replica exatamente uma difusão contínua; gaps, IV variável, custos e dividendos errados geram residual. Uma única semente demonstra mecânica, não uma distribuição de resultados. Para avaliar eficácia, use vários caminhos e compare caudas, desvio e necessidade máxima de caixa.'
],formula:{expression:'B_n = B_(n−1)e^(rΔt) + dividendos − (H_n−H_(n−1))S_n − custos; P&L_T = B_T + H_T S_T − payoff_vendido',variables:'B: caixa em R$; H: ações de hedge; r: financiamento contínuo; Δt: anos. Prêmio recebido entra em B_0; custo de liquidação deve ser incluído.'},example:{title:'Um ajuste contado corretamente',steps:['Venda uma call por 8; spot 100; delta 0,50. Compre 0,50 ação por 50. Caixa inicial B = 8−50 = −42.','Sem juros no intervalo, spot sobe a 104 e delta vai a 0,60. Compre mais 0,10 ação por 10,40.','Antes dos custos, caixa = −42−10,40 = −52,40 e estoque = 0,60 ação.','O hedge não “ganhou 2” em caixa livre: a valorização do estoque coexistiu com variação da opção e financiamento. A conta completa só fecha ao marcar todas as posições.']},desk:'Reconcilie diariamente estoque, caixa de prêmio, trades de hedge, juros, proventos e custos. Diferenças entre P&L de risco e contábil frequentemente estão nesses fluxos.',mistakes:['Ignorar funding da compra de ações.','Rebalancear o hedge usando o spot futuro antes de ele existir.','Comparar caminhos diferentes para hedgeado e descoberto.'],references:['natenberg','hull','mit-finance'],lab:'hedge'},[
num('Venda de call por 6, spot 100 e delta 0,40. Após comprar o hedge, qual o caixa inicial por unidade?',-34,'Recebe 6 e paga 0,40×100 = 40. Caixa = −34.',0.01,2),
choice('Para hedge delta de uma call vendida, normalmente a mesa:',['Compra ações.','Vende ações adicionais.','Compra outra call e ignora a quantidade.'],0,'A call vendida tem delta negativo; ações compradas adicionam delta positivo.',['Correto, dimensionado pelo delta da posição.','Isso aumentaria o delta negativo.','Outra opção pode alterar risco, mas exige dimensionamento e cria outras gregas.']),
num('Estoque de hedge passa de 40 para 55 ações com spot 102. Sem custos, quanto sai do caixa?',1530,'Compra de 15 ações × 102 = R$ 1.530.',0.01,1),
choice('Uma semente fixa no simulador permite:',['Eliminar risco do hedge.','Reproduzir o mesmo caminho e comparar configurações.','Garantir o preço correto do ativo real.'],1,'Reprodutibilidade facilita atribuir diferenças à frequência e aos custos.',['O caminho ainda tem risco e o modelo tem limites.','Correto: não é garantia estatística.','Os preços são fictícios, não previsões.']),
open('Que fluxos precisam aparecer no P&L de um hedge de call vendida?',['Prêmio e payoff da opção.','Compras/vendas e liquidação das ações.','Juros, dividendos, custos e eventuais aportes.'],'Registre prêmio recebido, cada trade de ação com sinal, juros sobre caixa positivo/negativo, dividendos do estoque, custos e liquidação final. Subtraia o payoff devido da call. Se houver aporte externo, registre-o para não confundir capital novo com lucro.')
]);

add({id:'h2',moduleId:'hedging',title:'Gamma scalping: movimento comprado, tempo vendido',minutes:50,level:'Avançado',prerequisites:['h1','v1'],objectives:['Relacionar gamma, theta e variância realizada.','Entender o sentido dos rebalanceamentos.','Calcular o impacto de custos sobre scalping.'],intuition:'Long gamma faz o hedge vender após altas e comprar após quedas. Mas a opção que permite esse comportamento foi comprada e perde valor com o relógio.',theory:[
'Considere uma opção comprada e um hedge de −Δ ações. Quando o ativo sobe, delta da opção aumenta se gamma é positivo; para neutralizar, vende-se mais ações. Quando o ativo cai, recompra-se. Esse mecanismo realiza ganhos de rebalanceamento num caminho oscilante, mas não constitui dinheiro grátis: a opção tem prêmio e theta. Para uma posição short gamma, os trades se invertem, comprando depois de altas e vendendo depois de quedas.',
'Sob uma aproximação local com hedge contínuo, custos zero e financiamento corretamente tratado, o P&L incremental long gamma se relaciona a ½ΓS²(σ_real²−σ_impl²)dt. Gamma é peso que varia no caminho; não basta comparar duas médias simples de volatilidade no fim do mês. Se o ativo se afasta do strike, o gamma pode cair; movimentos grandes em regiões de pouco gamma geram menos ganho do que a mesma variância perto do strike.',
'Em hedge discreto, o movimento efetivamente capturado depende da frequência. Rebalancear mais frequentemente reduz parte do risco de discretização, mas multiplica custos fixos e proporcionais. Slippage cresce com urgência e liquidez ruim. Um gap pode levar o spot muito além da região em que o hedge foi calculado. A escolha de frequência deve equilibrar erro, custos, limites e capacidade operacional; não existe uma frequência universal que maximize o resultado em todos os caminhos.'
